<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>수학 나침반</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  svg: { fontCache: 'global' },
  startup: { typeset: false }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" async></script>
<style>
/* Layout: 모눈 공책 — 왼쪽은 교육과정 목차(학교급→학년→학기→단원), 오른쪽은 모눈종이 위 질문 노트 */
:root {
  --paper: #F5F6F1;
  --panel: #FFFFFF;
  --ink: #1C2230;
  --muted: #5B6372;
  --line: #DADED3;
  --grid: rgba(43, 74, 203, .07);
  --accent: #2B4ACB;
  --accent-soft: #E7ECFB;
  --mark: #C4402E;
  --mark-soft: #FBEAE6;
  --face: #F5D9C3;
  --t-idea: #7556D9;
  --t-step: #1E8A6E;
  --t-check: #C4402E;
  --display: "Gowun Batang", "Nanum Myeongjo", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13161C; --panel: #1A1E26; --ink: #E7E9EE; --muted: #9AA1AE; --line: #2B313C;
    --grid: rgba(142, 162, 255, .06); --accent: #93A6FF; --accent-soft: #232A45; --mark: #FF8B79; --mark-soft: #3A231F;
    --face: #EBCDB6; --t-idea: #A48BFF; --t-step: #4CC3A0; --t-check: #FF8B79;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13161C; --panel: #1A1E26; --ink: #E7E9EE; --muted: #9AA1AE; --line: #2B313C;
  --grid: rgba(142, 162, 255, .06); --accent: #93A6FF; --accent-soft: #232A45; --mark: #FF8B79; --mark-soft: #3A231F;
  --face: #EBCDB6; --t-idea: #A48BFF; --t-step: #4CC3A0; --t-check: #FF8B79;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100%; }

/* ---------- sidebar ---------- */
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding-block: 20px 14px; padding-inline: 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand h1 { font-family: var(--display); font-size: 23px; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.nav-toggle { display: none; }
.nav-body { flex: 1; overflow-y: auto; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 18px; }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: block; }
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.search::placeholder { color: var(--muted); }
.results { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.results button { text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 6px; font-size: 13.5px; }
.results button:hover { background: var(--accent-soft); }
.results small { color: var(--muted); display: block; font-size: 12px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 6px 11px; font-size: 13.5px; min-width: 40px; }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); font-weight: 600; }
.seg.lv button { flex: 1; }
.tag { font-family: var(--mono); font-size: 11px; color: var(--mark); margin-top: 6px; }
.units { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.units button { width: 100%; text-align: left; display: grid; grid-template-columns: 26px 1fr; align-items: baseline; gap: 4px; border: 0; background: transparent; padding: 8px 8px; border-radius: 7px; font-size: 14.5px; }
.units button:hover { background: var(--paper); }
.units button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.units .n { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.units button[aria-current="true"] .n { color: var(--accent); }

/* ---------- main ---------- */
.main { display: flex; flex-direction: column; min-height: 0; min-width: 0;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; }
.head { padding-block: 22px 14px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 88%, transparent); }
.crumb { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.crumb b { color: var(--mark); font-weight: 500; }
.head h2 { font-family: var(--display); font-size: clamp(24px, 3.4vw, 32px); line-height: 1.25; margin: 4px 0 10px; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.act { border: 0; background: var(--ink); color: var(--panel); border-radius: 7px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
.act:hover { background: var(--accent); }
.act.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.act.ghost:hover { color: var(--ink); background: var(--panel); }

.path-wrap { margin-top: 14px; }
.path { position: relative; list-style: none; margin: 0; padding: 0 0 4px; display: flex; gap: 0; overflow-x: auto; scrollbar-width: thin; }
.path li { flex: none; display: flex; align-items: center; }
.path li + li::before { content: ""; width: 18px; height: 2px; background: var(--line); }
.path li.after::before { background: repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 7px); }
.path button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 10px; text-align: left; font-size: 13px; line-height: 1.35; }
.path button small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.path button:hover { border-color: var(--accent); }
.path li.now button { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.path li.now button small { color: rgba(255,255,255,.8); }
.path li.after button { border-style: dashed; }
.mode { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin-right: 8px; vertical-align: middle; }
.mode button { border: 0; background: transparent; padding: 3px 10px; font-size: 12.5px; color: var(--muted); }
.mode button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.ava { display: block; flex: none; }
.ava .eyes { animation: blink 5s infinite; transform-origin: 32px 35px; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.ava.think .eyes { animation: look 1.4s ease-in-out infinite alternate; }
@keyframes look { from { transform: translate(-1.6px, -1.4px); } to { transform: translate(1.6px, -1.4px); } }
.brand-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--muted); background: var(--panel); white-space: nowrap; vertical-align: middle; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--engine, #D97757); }
.who { display: flex; align-items: center; gap: 8px; font-family: var(--body); font-size: 13px; letter-spacing: 0; color: var(--ink); font-weight: 600; margin-bottom: 8px; }
.hello { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
.hello .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 10px 14px; min-width: 0; }
.hello .bubble b { font-family: var(--display); font-size: 17px; display: block; margin-bottom: 2px; }
.hello .bubble p { margin: 0; color: var(--muted); }
.meeting { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
.seat { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; background: var(--paper); min-width: 0; }
.seat .nm { font-size: 13px; font-weight: 600; line-height: 1.25; }
.seat .st { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.seat .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex: none; }
.seat[data-s="run"] .st::before { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.seat[data-s="done"] .st::before { background: var(--t-step); }
.seat[data-s="fail"] .st::before { background: var(--mark); }
.seat[data-s="run"] { border-color: var(--accent); }
.stage { grid-column: 1 / -1; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.minutes { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 13.5px; }
.minutes > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.minutes .draft { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--paper); }
.minutes .draft > .who { margin-bottom: 4px; }
.log { flex: 1; overflow-y: auto; padding-block: 22px 12px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 760px; min-width: 0; }
.msg.me { align-self: flex-end; background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me img { display: block; max-width: 220px; border-radius: 8px; margin-top: 6px; }
.msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 12px 18px; width: 100%; }
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol { margin: .5em 0; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--display); line-height: 1.3; margin: 1em 0 .4em; font-size: 18px; }
.md strong { color: var(--mark); font-weight: 600; }
.md code { font-family: var(--mono); font-size: .92em; background: var(--paper); padding: 1px 5px; border-radius: 4px; }
.md pre { overflow-x: auto; background: var(--paper); padding: 10px; border-radius: 8px; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; font-variant-numeric: tabular-nums; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 10px; }
.md blockquote { margin: .6em 0; padding: 4px 12px; border-left: 3px solid var(--mark); background: var(--mark-soft); border-radius: 0 6px 6px 0; }
.md .mjx-block { overflow-x: auto; overflow-y: hidden; margin: .4em 0; }
.md mjx-container[display="true"] { margin: .4em 0 !important; }
.md details { margin-top: 12px; border: 1px dashed var(--mark); border-radius: 8px; padding: 6px 12px; }
.md details summary { cursor: pointer; color: var(--mark); font-weight: 600; }
.md details[open] summary { margin-bottom: 6px; }
.md details h3 { display: none; }
.thinking { color: var(--muted); font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
.thinking::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.note { font-size: 13px; color: var(--mark); margin-top: 6px; }

.welcome { max-width: 760px; }
.welcome p { margin: 0 0 10px; color: var(--muted); }
.welcome .ex { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.welcome .ex button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 14px; text-align: left; font-size: 14px; }
.welcome .ex button:hover { border-color: var(--accent); color: var(--accent); }

.composer { padding-block: 10px 16px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); background: var(--paper); }
.box { max-width: 820px; display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.box:focus-within { border-color: var(--accent); }
.box textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; outline: none; max-height: 160px; padding: 6px 4px; line-height: 1.5; }
.icon-btn { border: 1px solid var(--line); background: transparent; border-radius: 8px; width: 38px; height: 38px; display: grid; place-items: center; flex: none; color: var(--muted); }
.icon-btn:hover { color: var(--ink); }
.send { border: 0; background: var(--accent); color: #fff; border-radius: 8px; height: 38px; padding: 0 16px; font-weight: 600; flex: none; }
.send.stop { background: var(--mark); }
.send:disabled { opacity: .45; cursor: default; }
.attach { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
.attach img { height: 44px; border-radius: 6px; border: 1px solid var(--line); }
.attach button { border: 0; background: none; color: var(--mark); font-size: 13px; }
.status { max-width: 820px; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
#status.warn { color: var(--mark); }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { display: block; height: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; max-height: 100dvh; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
  .brand { padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand h1 { font-size: 19px; }
  .brand p { display: none; }
  .nav-toggle { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 10px; font-size: 13px; max-width: 62%; }
  .nav-toggle span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-body { display: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-height: 70dvh; }
  .side.open .nav-body { display: flex; }
  .main { min-height: 80dvh; }
  .head, .log, .composer { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .log { overflow: visible; }
  .composer { position: sticky; bottom: 0; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
  .msg.ai { padding: 10px 14px; }
}
@media (prefers-reduced-motion: reduce) { .thinking::before, .ava .eyes, .seat .st::before { animation: none !important; } }
</style>

<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="brand-id">
        <span id="brandAva"></span>
        <div>
          <h1>수학 나침반</h1>
          <p>나침 선생님 <span class="badge">Claude</span></p>
        </div>
      </div>
      <button class="nav-toggle" id="navToggle" aria-expanded="false"><span id="navSummary">단원 고르기</span> ▾</button>
    </div>
    <div class="nav-body">
      <div>
        <label class="label" for="q">단원 찾기</label>
        <input class="search" id="q" type="search" placeholder="예: 인수분해, 분수, 확률" autocomplete="off">
        <div class="results" id="results"></div>
      </div>
      <div>
        <span class="label">학교</span>
        <div class="seg lv" id="lvSeg"></div>
      </div>
      <div>
        <span class="label">학년</span>
        <div class="seg" id="gSeg"></div>
      </div>
      <div>
        <span class="label" id="termLabel">학기</span>
        <div class="seg" id="tSeg"></div>
        <div class="tag" id="tagLine"></div>
      </div>
      <div>
        <span class="label">단원</span>
        <ul class="units" id="unitList"></ul>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="head">
      <div class="crumb" id="crumb"></div>
      <h2 id="unitTitle"></h2>
      <div class="chips" id="subChips"></div>
      <div class="actions" id="actions"></div>
      <div class="path-wrap">
        <span class="label" id="pathLabel">배움의 길</span>
        <ol class="path" id="path"></ol>
      </div>
    </header>
    <section class="log" id="log" aria-live="polite"></section>
    <div class="composer">
      <div class="attach" id="attach" hidden>
        <img id="attachImg" alt="첨부한 문제 사진">
        <span>문제 사진이 함께 보내져요</span>
        <button id="attachDel" type="button">빼기</button>
      </div>
      <form class="box" id="form">
        <button class="icon-btn" type="button" id="photoBtn" title="문제 사진 올리기" aria-label="문제 사진 올리기" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
        </button>
        <input type="file" id="file" accept="image/*" hidden>
        <textarea id="input" rows="1" placeholder="이 단원에서 궁금한 걸 물어보세요"></textarea>
        <button class="send" id="send" type="submit">보내기</button>
      </form>
      <div class="status"><span class="mode" id="mode" role="group" aria-label="답변 방식"><button type="button" data-m="deep" aria-pressed="true">AI 회의</button><button type="button" data-m="fast" aria-pressed="false">빠르게</button></span><span id="status"></span></div>
    </div>
  </main>
</div>

<script>
/* ---------- 교육과정 데이터 ----------
   형식: '단원명|소단원·소단원·…'  (초1~2는 국정, 초3~고는 검정이라 출판사마다 이름·순서가 조금 달라요) */
const T = (name, tag, units) => ({ name, tag, units: units.map(s => { const [t, subs] = s.split('|'); return { title: t, subs: subs.split('·') }; }) });
const DATA = {

/* 영역(배움의 줄기): N 수와 연산 · A 식과 함수 · G 도형과 측정 · D 자료와 확률 — 단원 순서대로 한 글자씩 */

  '초1-0': 'NGNGN', '초1-1': 'NNGNAN', '초2-0': 'NGNGDN', '초2-1': 'NNGGDA',
  '초3-0': 'NGNNGN', '초3-1': 'NNGNGD', '초4-0': 'NGNGDA', '초4-1': 'NGNGDG',
  '초5-0': 'NNANNG', '초5-1': 'NNGNGD', '초6-0': 'NGNADG', '초6-1': 'NNGAGG',
  '중1-0': 'NNAAA', '중1-1': 'GGGGD', '중2-0': 'NAAA', '중2-1': 'GGGGD', '중3-0': 'NAAA', '중3-1': 'GGD',
  '고1-0': 'AADA', '고1-1': 'GAA', '고2-0': 'AAA', '고2-1': 'AAA', '고2-2': 'DDD',
  '고3-0': 'AAA', '고3-1': 'AAA', '고3-2': 'AAA', '고3-3': 'DDD', '고3-4': 'GGG'
};

const ORDER = [];   // 초1 → 고3 전체 단원을 배우는 순서대로
for (const lv of ['초', '중', '고']) for (const g of Object.keys(DATA[lv]).map(Number)) DATA[lv][g].forEach((t, ti) => t.units.forEach((u, ui) => {
  u.k = (STR[`${lv}${g}-${ti}`] || '')[ui] || 'A';
  ORDER.push({ lv, g, t: ti, u: ui, unit: u, term: t, short: `${lv}${g}${lv === '고' ? ' ' + t.name.replace(/^\d학기 · /, '') : '-' + (ti + 1)}` });
}));
// 고3(2015 수능 과목)과 고2(2022 과목)는 같은 내용을 다른 이름으로 배우므로, 지금 학년 쪽 줄기만 씀
function strandPath(p) {
  const k = DATA[p.lv][p.g][p.t].units[p.u].k;
  return ORDER.filter(x => x.unit.k === k && (p.lv === '고' && p.g === 3 ? !(x.lv === '고' && x.g === 2) : !(x.lv === '고' && x.g === 3)));
}
function curriculumMap() {
  const lines = [];

    lines.push(`${lv}${g} ${t.name}(${t.tag}): ` + t.units.map((u, i) => `${i + 1}.${u.title}[${u.subs.join('/')}]`).join(' ')));
  return lines.join('\n');
}

/* 마크다운 + 수식 */
function renderMD(el, text, final) {
  const maths = [];
  let t = text
    .replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]/g, (_, a, b) => { maths.push({ d: true, s: a ?? b }); return `@@M${maths.length - 1}@@`; })
    .replace(/\$([^$\n]+?)\$|\\\(([\s\S]+?)\\\)/g, (_, a, b) => { maths.push({ d: false, s: a ?? b }); return `@@M${maths.length - 1}@@`; });
  t = t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  let html = window.marked ? marked.parse(t, { breaks: true }) : t.replace(/\n/g, '<br>');
  html = html.replace(/@@M(\d+)@@/g, (_, i) => { const m = maths[+i]; const s = esc(m.s); return m.d ? `<div class="mjx-block">\\[${s}\\]</div>` : `\\(${s}\\)`; });
  el.innerHTML = html;
  if (!final) return;
  // "정답" 제목 아래는 접어 두기
  const h = [...el.querySelectorAll('h2, h3, h4')].find(x => /정답/.test(x.textContent));
  if (h && h.parentNode === el) {
    const det = document.createElement('details'); const sum = document.createElement('summary');
    sum.textContent = h.textContent.trim() || '정답과 풀이 보기'; det.append(sum);
    let n = h; el.insertBefore(det, h);
    while (n) { const next = n.nextSibling; det.append(n); n = next; }
  }
  typeset(el);
}
function typeset(el) {
  const mj = window.MathJax;
  if (mj && mj.typesetPromise) {
    (mj.startup && mj.startup.promise ? mj.startup.promise : Promise.resolve()).then(() => mj.typesetPromise([el])).catch(() => {});
  } else setTimeout(() => typeset(el), 400);
}

  if (!sample) { setStatus('AI 선생님은 claude.ai에서 이 페이지를 열었을 때 대답해요. 목차는 지금도 볼 수 있어요.', true); return; }
  try { const lim = await sample.limits(); canImg = !!(lim && lim.images); } catch { canImg = false; }
  $('photoBtn').hidden = !canImg;
  setStatus('처음 질문할 때 Claude 사용 허락을 한 번 물어봐요.');
})();
function setStatus(t, warn) { const s = $('status'); s.textContent = t || ''; s.classList.toggle('warn', !!warn); }

const MAP_TEXT = curriculumMap();
function rules() {
  const tm = term(), u = unit(), lv = LV[pos.lv];
  const path = strandPath(pos);
  const at = path.findIndex(x => x.lv === pos.lv && x.g === pos.g && x.t === pos.t && x.u === pos.u);
  const flow = path.map((x, i) => (i === at ? '▶[지금] ' : '') + `${x.short} ${x.unit.title}`).join(' → ');
  const young = pos.lv === '초' && pos.g <= 2;
  return `너는 "수학 나침반", 한국 학생을 가르치는 최고 수준의 수학 선생님이야. 대학 수학까지 깊이 이해하고 있지만, 학생에게는 그 학년 눈높이로 가장 쉽게 설명해. 목표는 단 하나: 지금 내용을 쉽게 이해하면서도, 앞으로 배울 모든 수학이 이 위에 자연스럽게 쌓이도록 기초를 정확하게 놓아 주는 것.

[학생이 지금 공부하는 곳]
- ${lv} ${pos.g}학년 ${tm.name} (${tm.tag} 교육과정)
- 단원: ${pos.u + 1}. ${u.title}
- 소단원·핵심 내용: ${u.subs.join(', ')}
- 이 단원의 영역 "${STRAND[u.k]}"의 흐름(초1→고3): ${flow}

[한국 수학 교육과정 전체 지도] (학년 학기: 단원[소단원])
${MAP_TEXT}

[가장 중요한 원칙]
A. 쉽게, 하지만 거짓말 없이. 나중에 고쳐야 하는 설명은 절대 하지 마. 예: "곱하면 항상 커진다", "작은 수에서 큰 수는 못 뺀다", "분수는 1보다 작다", "x²의 그래프는 U자일 뿐" 같은 말 대신, 지금 학년 범위에서 참이면서 나중에 그대로 넓어질 수 있는 설명을 해. (예: "지금은 자연수끼리만 다뤄서 그래요. 중1 때 음수를 배우면 뺄 수 있게 돼요.")
B. 공식은 '왜'부터. 외우게 하지 말고 그림·비유·작은 예로 원리를 보여 준 뒤 공식으로 정리해. 원리를 알면 공식을 잊어도 다시 만들 수 있게.
C. 앞뒤를 연결해. 위 흐름과 전체 지도를 보고, 이 개념이 실제로 이어지는 뒤 단원을 '중2-1 일차함수와 그래프'처럼 정확한 이름으로 짚고, 지금 개념이 거기서 어떻게 다시 쓰이는지 학생 말로 한 줄씩 미리 보여 줘. 앞 학년 개념이 부족해 보이면 그 단원 이름을 말하고 짧게 다시 짚어 줘.
D. 정확성이 최우선. 계산은 답을 쓰기 전에 다른 방법으로 한 번 더 검산해. 한국 교과서의 정확한 용어와 정의를 써(예: 최대공약수, 기약분수, 근의 공식, 판별식). 확실하지 않은 건 확실하지 않다고 말해.
E. 학년 범위를 지켜. 아직 안 배운 기호·방법(예: 초등학생에게 미지수 x·음수, 중학생에게 미분)으로 풀지 말고 그 학년 방법으로 풀어. 더 빠른 상위 방법이 있으면 "나중에 ○○에서 더 쉽게 푸는 방법을 배워요"라고만 알려 줘.
F. 질문이 다른 학년·단원 내용이면 먼저 "이건 ○○ ○학년 ○학기 '단원명' 내용이에요"라고 알려 주고, 학생이 고른 학년 기준으로 이해할 수 있게 설명해.

[개념을 물어볼 때 답의 모양]
**한 줄 핵심** — 가장 쉬운 말로 한 문장.
**왜 그럴까?** — 그림을 떠올릴 수 있는 비유나 작은 예로 원리를 보여 줘.
**예시로 보기** — 대표 예 1~2개를 번호 단계로 풀이.
**이렇게 이어져요** — 뒤에 배울 단원 1~3개와 연결(원칙 C). 짧게.
**확인 문제** — 이해를 확인하는 문제 1개. 답은 맨 끝 "### 정답과 풀이" 아래에.
(단순 계산이나 짧은 질문이면 형식을 줄여서 짧게 답해도 돼.)

[그 밖의 규칙]
1. 한국어, 친근한 존댓말(~해요).
2. 수식은 LaTeX: 문장 안은 $...$, 한 줄 전체는 $$...$$. 표가 도움이 되면 마크다운 표를 써.${young ? '\n3. 1~2학년이니 기호는 최소로, 사과·사탕·블록 같은 물건으로 설명하고 문장은 아주 짧게.' : ''}
4. 문제를 낼 때는 문제를 먼저 모두 쓰고, 정답과 풀이는 맨 끝 "### 정답과 풀이" 제목 아래에 모아 써.
5. 학생이 답이나 풀이를 보내면 맞았는지 먼저 말하고, 틀렸으면 어느 단계의 어떤 생각이 틀렸는지 짚고 올바른 생각으로 고쳐 줘. 실수의 원인이 앞 학년 개념이면 그 단원을 알려 줘.
6. 문제 사진이 오면 먼저 문제를 정확히 옮겨 적고, 위 원칙대로 풀어 줘. 글씨가 잘 안 보이면 다시 찍어 달라고 해.
7. 수학과 상관없는 질문은 짧게 답하고 수학 공부로 돌아오게 해.`;
}

const ERR = {
  not_granted: 'Claude 사용을 허락하지 않아서 AI 선생님이 대답할 수 없어요.',
  sampling_disabled: '이 계정에서는 AI 기능을 쓸 수 없어요.',
  rate_limited: '질문이 너무 많아요. 잠시 뒤에 다시 보내 주세요.',
  session_expired: '로그인이 만료됐어요. 다시 로그인해 주세요.',
  image_rejected: '이 사진은 보낼 수 없어요. 다른 사진(JPG, PNG)으로 올려 주세요.',
  prompt_too_large: '대화가 너무 길어졌어요. "대화 새로 시작"을 눌러 주세요.',
  refused: '이 질문에는 답할 수 없어요. 다르게 물어봐 주세요.',
  empty_completion: '대답이 비어 있어요. 질문을 조금 바꿔서 다시 보내 주세요.'
};

function seatHTML(kind, name, engine) {
  return `<div class="seat" data-s="wait" data-k="${kind}">${face(kind, 34)}<div style="min-width:0"><div class="nm">${esc(name)} ${badge(engine)}</div><div class="st">기다리는 중</div></div></div>`;
}
function setSeat(box, k, state, label) {
  const el = box.querySelector(`.seat[data-k="${k}"]`); if (!el) return;
  el.dataset.s = state; el.querySelector('.st').textContent = label;
  const ava = el.querySelector('.ava'); if (ava) ava.classList.toggle('think', state === 'run');
}

async function ask(text) {
  text = (text || '').trim();
  if (busy || (!text && !pendingImg)) return;
  if (!sample) { setStatus('AI 선생님은 claude.ai에서 열었을 때만 대답해요.', true); return; }
  const k = keyOf(pos);
  const list = chats.get(k) || []; chats.set(k, list);
  const img = pendingImg;
  const userMsg = { role: 'user', content: text || '이 사진 속 문제를 풀어 주세요.' };
  if (img) userMsg.img = img.url;
  list.push(userMsg);
  clearAttach(); $('input').value = ''; autosize();

  const log = $('log');
  if (log.querySelector('.welcome')) log.replaceChildren();
  log.append(msgEl(userMsg));
  const meet = mode === 'deep';
  const box = document.createElement('div'); box.className = 'msg ai';
  box.innerHTML = whoHTML('main', MAIN_NAME, 'Claude', true) +
    (meet ? `<div class="meeting"><div class="stage">AI 회의 중</div>${TEACHERS.map(t => seatHTML(t.id, t.name, t.engine)).join('')}${seatHTML('judge', '심사 · 최고 답 고르기', 'Claude Opus').replace('data-k="judge">' + face('judge', 34), 'data-k="judge">' + face('main', 34))}${seatHTML('easy', '제일 쉽게 바꾸기', 'Claude Sonnet').replace('data-k="easy">' + face('easy', 34), 'data-k="easy">' + face('main', 34))}</div>` : '') +
    '<div class="md"><span class="thinking">생각하는 중…</span></div>';
  log.append(box); scrollEnd();
  const md = box.querySelector('.md');

  setBusy(true); setStatus('');
  ctl = new AbortController(); const signal = ctl.signal;
  const turns = list.slice(-12).map(m => ({ role: m.role, content: m.role === 'user' && m.img ? m.content + '\n(문제 사진을 함께 보냈어요)' : m.content }));
  while (turns.length && turns[0].role !== 'user') turns.shift();
  const imgs = img && canImg ? [img.blob] : null;
  const base = rules();

  let raf = 0, latest = '';
  const stream = ({ text }) => { latest = text; if (!raf) raf = requestAnimationFrame(() => { raf = 0; renderMD(md, latest, false); scrollEnd(); }); };
  const aiMsg = { role: 'assistant', content: '' };
  const fail = e => {
    const code = e && e.code;
    if (code === 'cancelled') return '여기서 멈췄어요.';
    const msg = ERR[code] || '연결이 잠깐 끊겼어요. 다시 보내 주세요.';
    setStatus(msg, true);
    if (code === 'not_granted' || code === 'sampling_disabled') sample = null;
    return msg;
  };

  try {
    if (!meet) {
      const res = await sample([{ role: 'user', content: base }, ...turns], { cache: false, signal, onText: stream, modelTier: 'default', ...(imgs ? { images: imgs } : {}) });
      aiMsg.content = res.text;
      if (res.truncated) aiMsg.note = '답이 길어서 중간에 끊겼어요. "이어서 설명해 주세요"라고 보내 보세요.';
    } else {
      // 1) 선생님들이 각자 초안을 씀
      md.innerHTML = '<span class="thinking">선생님들이 각자 답을 쓰는 중… (1분쯤 걸려요)</span>';
      const drafts = TEACHERS.map(t => ({ id: t.id, name: t.name, engine: t.engine, text: '' }));
      const results = await Promise.allSettled(TEACHERS.map((t, i) => {
        setSeat(box, t.id, 'run', '답 쓰는 중');
        return callAI(t, [{ role: 'user', content: base + '\n\n[AI 회의에서 너의 역할]\n' + t.role + '\n이 답은 다른 선생님 답과 비교·심사돼. 정확하고 충실하게 써.' }, ...turns],
          { cache: false, signal, ...(imgs ? { images: imgs } : {}) })
          .then(r => {
            drafts[i].text = r.text;
            const real = TIER_NAME[r.modelTierApplied];
            if (real && real !== t.engine) { drafts[i].engine = real; const bd = box.querySelector(`.seat[data-k="${t.id}"] .badge`); if (bd) bd.textContent = real; }
            setSeat(box, t.id, 'done', '초안 완성'); return r; },
                e => { setSeat(box, t.id, 'fail', e && e.code === 'cancelled' ? '멈춤' : '참여 못 함'); throw e; });
      }));
      if (signal.aborted) throw { code: 'cancelled' };
      const ok = drafts.filter(d => d.text);
      if (!ok.length) throw (results.find(r => r.status === 'rejected') || {}).reason || { code: 'upstream_error' };
      aiMsg.panel = { drafts };

      // 2) 심사: 초안을 비교·검산해서 최고 답 하나로
      setSeat(box, 'judge', 'run', '비교하고 검산하는 중');
      md.innerHTML = '<span class="thinking">초안을 비교하고 검산해서 최고 답을 고르는 중…</span>';
      let best = '';
      try {
        const r = await sample([{ role: 'user', content: base }, ...turns, { role: 'user', content:
          `[AI 회의 · 심사]\n위 질문에 대해 선생님 ${ok.length}명이 쓴 초안이 아래에 있어. 너는 심사 선생님이야.\n` +
          `1) 모든 계산과 결론을 직접 다시 검산해. 초안끼리 다르면 누가 맞는지 근거를 가지고 판단해.\n` +
          `2) 틀린 내용, 학년 범위를 벗어난 방법, 나중에 고쳐야 하는 설명은 버려.\n` +
          `3) 가장 좋은 원리 설명, 가장 깔끔한 풀이, 가장 중요한 주의점, 가장 정확한 단원 연결만 골라 하나의 최고 답안으로 합쳐.\n` +
          `4) 답안만 써. 심사 과정이나 "선생님 A는…" 같은 말은 쓰지 마. 답의 모양 규칙은 그대로 지켜.\n\n` +
          ok.map(d => `===== ${d.name} 초안 =====\n${d.text}`).join('\n\n') }],
          { cache: false, signal, modelTier: 'complex', effort: 'high' });
        best = r.text; setSeat(box, 'judge', 'done', '최고 답 결정');
      } catch (e) {
        if (e && e.code === 'cancelled') throw e;
        best = (drafts.find(d => d.id === 'idea' && d.text) || ok[0]).text;
        setSeat(box, 'judge', 'fail', '초안 하나로 진행');
      }
      aiMsg.panel.best = best;

      // 3) 제일 쉽게 바꾸기
      setSeat(box, 'easy', 'run', '쉽게 바꾸는 중');
      md.innerHTML = '<span class="thinking">제일 쉬운 말로 바꾸는 중…</span>';
      try {
        const who = `${LV[pos.lv]} ${pos.g}학년`;
        const r = await sample(
          `너는 수학 선생님 "${MAIN_NAME}"이야. 아래 [최고 답안]은 선생님들이 회의하고 검산해서 정한 답이야. 이걸 ${who} 학생이 가장 쉽게 이해하도록 다시 써.\n\n` +
          `[반드시 지킬 것]\n- 수학 내용, 숫자, 계산 결과, 정답은 하나도 바꾸지 마. 빠뜨리지도 마.\n- 문장은 짧게. 한 문장에 한 가지 생각만.\n- 어려운 낱말은 쉬운 말로 풀어. 교과서 용어(예: 약분, 일차함수)는 그대로 쓰되 처음 나올 때 괄호로 아주 쉬운 뜻을 붙여.\n- 머릿속에 그림이 그려지는 비유를 하나 넣어.\n- "한 줄 핵심 / 왜 그럴까? / 예시로 보기 / 이렇게 이어져요 / 확인 문제" 같은 소제목 구조와 맨 끝 "### 정답과 풀이"는 그대로 유지해.\n- 수식은 LaTeX($...$, $$...$$) 그대로.\n- 친근한 존댓말(~해요). 원래보다 길어지지 않게.\n- 바뀐 답만 써. "쉽게 바꿔 보면" 같은 머리말은 쓰지 마.\n\n` +
          `[학생 질문]\n${userMsg.content}${img ? ' (문제 사진 포함)' : ''}\n\n[최고 답안]\n${best}`,
          { cache: false, signal, onText: stream, modelTier: 'default' });
        aiMsg.content = r.text; setSeat(box, 'easy', 'done', '완성');
        if (r.truncated) aiMsg.note = '답이 길어서 중간에 끊겼어요. "이어서 설명해 주세요"라고 보내 보세요.';
      } catch (e) {
        if (e && e.code === 'cancelled') { aiMsg.content = latest; throw e; }
        aiMsg.content = best; setSeat(box, 'easy', 'fail', '원래 답으로 보여 줘요');
      }
    }
  } catch (e) {
    if (!aiMsg.content) aiMsg.content = (e && e.code !== 'refused' && e.text) || latest || '';
    aiMsg.note = fail(e);
    if (e && e.code === 'cancelled' && !aiMsg.content) aiMsg.note = '';
  } finally {
    if (raf) cancelAnimationFrame(raf), raf = 0;
    setBusy(false); ctl = null;
  }
  if (aiMsg.content) list.push(aiMsg);
  if (aiMsg.content || aiMsg.note || aiMsg.panel) box.replaceWith(msgEl(aiMsg)); else box.remove();
  scrollEnd();
}

function setBusy(b) {
  busy = b; const s = $('send');
  s.textContent = b ? '멈추기' : '보내기'; s.classList.toggle('stop', b);
  s.type = b ? 'button' : 'submit';
}

/* ---------- 입력 ---------- */
$('form').addEventListener('submit', e => { e.preventDefault(); ask($('input').value); });
$('send').addEventListener('click', e => { if (busy) { e.preventDefault(); ctl && ctl.abort(); } });
const inp = $('input');
function autosize() { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 160) + 'px'; }
inp.addEventListener('input', autosize);
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(inp.value); } });

$('photoBtn').onclick = () => $('file').click();
$('file').onchange = () => { const f = $('file').files[0]; if (f) setAttach(f); $('file').value = ''; };
inp.addEventListener('paste', e => {
  if (!canImg) return;
  const f = [...(e.clipboardData?.files || [])].find(x => x.type.startsWith('image/'));
  if (f) { e.preventDefault(); setAttach(f); }
});
function setAttach(f) {
  if (pendingImg) URL.revokeObjectURL(pendingImg.url);
  pendingImg = { blob: f, url: URL.createObjectURL(f) };
  $('attachImg').src = pendingImg.url; $('attach').hidden = false;
}
function clearAttach() { pendingImg = null; $('attach').hidden = true; }
$('attachDel').onclick = () => { if (pendingImg) URL.revokeObjectURL(pendingImg.url); clearAttach(); };

/* ---------- 검색 ---------- */
const INDEX = [];
for (const lv of Object.keys(DATA)) for (const g of Object.keys(DATA[lv])) DATA[lv][g].forEach((t, ti) => t.units.forEach((u, ui) => INDEX.push({ lv, g: +g, t: ti, u: ui, label: u.title, sub: `${LV[lv]} ${g}학년 · ${t.name}`, hay: (u.title + ' ' + u.subs.join(' ')).replace(/\s/g, '') })));
$('q').addEventListener('input', () => {
  const q = $('q').value.replace(/\s/g, ''); const r = $('results'); r.replaceChildren();
  if (!q) return;
  const hits = INDEX.filter(x => x.hay.includes(q)).slice(0, 8);
  if (!hits.length) { r.innerHTML = '<small style="color:var(--muted);padding:4px 8px">찾는 단원이 없어요. 질문창에 바로 물어봐도 몇 학년 내용인지 알려 줘요.</small>'; return; }
  hits.forEach(h => { const b = document.createElement('button'); b.type = 'button'; b.innerHTML = `${esc(h.label)}<small>${esc(h.sub)}</small>`; b.onclick = () => { pos = { lv: h.lv, g: h.g, t: h.t, u: h.u }; $('q').value = ''; r.replaceChildren(); go(); closeNavMobile(); }; r.append(b); });
});

/* ---------- 모바일 목차 ---------- */
$('navToggle').onclick = () => { const s = $('side'); const o = s.classList.toggle('open'); $('navToggle').setAttribute('aria-expanded', o); };
function closeNavMobile() { $('side').classList.remove('open'); $('navToggle').setAttribute('aria-expanded', 'false'); }

$('brandAva').innerHTML = face('main', 44);
function go() { if (busy && ctl) ctl.abort(); save(); renderNav(); renderHead(); renderLog(); }
go();
</script>
