<html lang="ko">
<head>

</head>
<body>
<title>수학 나침반</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" async></script>
<style>
/* Layout: 모눈 공책 — 왼쪽은 교육과정 목차(학교급→학년→학기→단원), 오른쪽은 모눈종이 위 질문 노트 */
:root {
  --paper: #F5F6F1;
  --panel: #FFFFFF;
  --ink: #1C2230;
  --muted: #5B6372;
  --line: #DADED3;
  --grid: rgba(43, 74, 203, .07);
  --accent: #2B4ACB;
  --accent-soft: #E7ECFB;
  --mark: #C4402E;
  --mark-soft: #FBEAE6;
  --face: #F5D9C3;
  --t-idea: #7556D9;
  --t-step: #1E8A6E;
  --t-check: #C4402E;
  --scrap: #FCFBF7;
  --btn: #1C2230;
  --btn-fg: #FFFFFF;
  --ava-bg: #E7ECFB;
  --bleed: rgba(28, 34, 48, .045);
  --pen-ink: #1C2230;
  --pen-blue: #2B4ACB;
  --pen-red: #C4402E;
  --display: "Gowun Batang", "Nanum Myeongjo", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13161C; --panel: #1A1E26; --ink: #E7E9EE; --muted: #9AA1AE; --line: #2B313C;
    --grid: rgba(142, 162, 255, .06); --accent: #93A6FF; --accent-soft: #232A45; --mark: #FF8B79; --mark-soft: #3A231F;
    --face: #EBCDB6; --t-idea: #A48BFF; --t-step: #4CC3A0; --t-check: #FF8B79;
    --scrap: #1E222A; --bleed: rgba(231, 233, 238, .04); --pen-ink: #ECEEF2; --pen-blue: #93A6FF; --pen-red: #FF8B79;
    --btn: #34405E; --btn-fg: #F1F3F8; --ava-bg: #2A3352;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13161C; --panel: #1A1E26; --ink: #E7E9EE; --muted: #9AA1AE; --line: #2B313C;
  --grid: rgba(142, 162, 255, .06); --accent: #93A6FF; --accent-soft: #232A45; --mark: #FF8B79; --mark-soft: #3A231F;
  --face: #EBCDB6; --t-idea: #A48BFF; --t-step: #4CC3A0; --t-check: #FF8B79;
  --scrap: #1E222A; --bleed: rgba(231, 233, 238, .04); --pen-ink: #ECEEF2; --pen-blue: #93A6FF; --pen-red: #FF8B79;
  --btn: #34405E; --btn-fg: #F1F3F8; --ava-bg: #2A3352;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100%; }

/* ---------- sidebar ---------- */
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding-block: 20px 14px; padding-inline: 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand h1 { font-family: var(--display); font-size: 23px; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.nav-toggle { display: none; }
.nav-body { flex: 1; overflow-y: auto; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 18px; }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: block; }
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.search::placeholder { color: var(--muted); }
.results { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.results button { text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 6px; font-size: 13.5px; }
.results button:hover { background: var(--accent-soft); }
.results small { color: var(--muted); display: block; font-size: 12px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 6px 11px; font-size: 13.5px; min-width: 40px; }
.seg button[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: var(--btn-fg); font-weight: 600; }
.seg.lv button { flex: 1; }
.tag { font-family: var(--mono); font-size: 11px; color: var(--mark); margin-top: 6px; }
.units { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.units button { width: 100%; text-align: left; display: grid; grid-template-columns: 26px 1fr; align-items: baseline; gap: 4px; border: 0; background: transparent; padding: 8px 8px; border-radius: 7px; font-size: 14.5px; }
.units button:hover { background: var(--paper); }
.units button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.units .n { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.units button[aria-current="true"] .n { color: var(--accent); }

/* ---------- main ---------- */
.main { display: flex; flex-direction: column; min-height: 0; min-width: 0;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; }
.head { padding-block: 22px 14px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 88%, transparent); }
.crumb { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.crumb b { color: var(--mark); font-weight: 500; }
.head h2 { font-family: var(--display); font-size: clamp(24px, 3.4vw, 32px); line-height: 1.25; margin: 4px 0 10px; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.act { border: 0; background: var(--btn); color: var(--btn-fg); border-radius: 7px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
.act:hover { background: var(--accent); color: #fff; }
.act.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.act.ghost:hover { color: var(--ink); background: var(--panel); }

.tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--line); margin-bottom: 12px; }
.tabs button { border: 0; background: transparent; border-radius: 8px; padding: 6px 16px; font-size: 14px; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.pbar { display: flex; flex-direction: column; gap: 10px; }
.prow-ctl { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.prow-ctl .label { margin: 0; min-width: 48px; }
.chip[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: var(--btn-fg); }
.chip .cnt { font-family: var(--mono); font-size: 11px; opacity: .7; margin-left: 4px; }
.lvseg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); }
.lvseg button { border: 0; background: transparent; padding: 5px 11px; font-size: 13px; display: flex; flex-direction: column; align-items: center; line-height: 1.2; gap: 2px; }
.lvseg button + button { border-left: 1px solid var(--line); }
.lvseg .dots { font-size: 8px; letter-spacing: 1px; color: var(--mark); }
.lvseg button[aria-pressed="true"] { background: var(--mark-soft); color: var(--mark); font-weight: 600; }
.lvdesc { font-size: 12.5px; color: var(--muted); }
.prob { max-width: 760px; width: 100%; background: var(--panel); border: 1.5px solid var(--ink); border-radius: 14px; padding: 16px 18px; box-shadow: 4px 4px 0 var(--accent-soft); }
.prob-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; margin-bottom: 10px; }
.pno { font-family: var(--display); font-size: 17px; }
.psub { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--muted); }
.plv { color: var(--mark); font-family: var(--mono); font-size: 11.5px; }
.pq { font-size: 16.5px; line-height: 1.75; }
.pfmt { margin-top: 10px; font-size: 13px; color: var(--muted); }
.pans { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.pans input { flex: 1 1 180px; min-width: 0; border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 12px; background: var(--paper); font-size: 15px; }
.pans input:focus { border-color: var(--accent); outline: none; }
.pans input:disabled { opacity: .7; }
.pbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.act:disabled { opacity: .45; cursor: default; }
.solved { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 12px; border-radius: 9px; background: color-mix(in srgb, var(--t-step) 14%, var(--panel)); color: var(--t-step); font-weight: 600; font-size: 14px; }
.hint-tag { display: inline-block; font-family: var(--mono); font-size: 11px; color: var(--t-idea); border: 1px solid var(--t-idea); border-radius: 999px; padding: 0 8px; margin-bottom: 4px; }
.msg.ai.right { border-color: var(--t-step); }
.msg.ai.wrong { border-color: var(--mark); }
.msg.me.ans { background: var(--accent); }
.gen-steps { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; font-size: 13.5px; color: var(--muted); }
.modeseg { display: inline-flex; gap: 6px; }
.modeseg button { border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 14px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
.modeseg button svg { flex: none; }
.modeseg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.log > * { flex: none; box-sizing: border-box; }
.book { max-width: 920px; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(20,30,60,.35); overflow: hidden; }
.bk-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; padding-block: 18px 14px; padding-inline: 22px; border-bottom: 3px double var(--ink); background: linear-gradient(90deg, var(--accent) 0 8px, transparent 8px); }
.bk-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--accent); }
.bk-head h3 { font-family: var(--display); font-size: 26px; margin: 2px 0 4px; line-height: 1.2; }
.bk-meta { font-size: 13px; color: var(--muted); }
.bk-name { font-size: 13px; color: var(--muted); display: grid; grid-template-columns: auto 120px; gap: 6px 8px; align-items: end; }
.bk-name span { border-bottom: 1px solid var(--muted); min-height: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
.bk-score { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 22px; background: var(--mark-soft); border-bottom: 1px solid var(--line); }
.bk-score .big { font-family: var(--display); font-size: 30px; color: var(--mark); line-height: 1; font-variant-numeric: tabular-nums; }
.bk-score .big small { font-size: 17px; color: var(--muted); }
.bk-body { padding: 4px 22px 18px; }
.bk-sec { display: flex; align-items: center; gap: 10px; margin: 18px 0 10px; font-size: 14px; }
.bk-sec .step { font-family: var(--mono); font-size: 11px; color: var(--btn-fg); background: var(--btn); border-radius: 4px; padding: 2px 7px; letter-spacing: .06em; }
.bk-sec b { font-family: var(--display); font-size: 17px; }
.bk-sec .dots { color: var(--mark); font-size: 9px; letter-spacing: 1px; }
.bk-sec::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
.bk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.bk-item { position: relative; padding: 14px 14px 12px 52px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bk-no { position: absolute; left: 12px; top: 12px; width: 30px; height: 30px; display: grid; place-items: center; font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums; }
.bk-item[data-r="right"] .bk-no::after, .bk-item[data-r="fixed"] .bk-no::after { content: ""; position: absolute; inset: -6px; border: 2.5px solid var(--mark); border-radius: 50%; transform: rotate(-12deg) scale(1.05, .95); }
.bk-item[data-r="fixed"] .bk-no::after { border-style: dashed; }
.bk-item[data-r="wrong"] .bk-no::after { content: ""; position: absolute; left: -4px; right: -4px; top: 50%; border-top: 2.5px solid var(--mark); transform: rotate(-58deg); }
.bk-q { font-size: 15px; line-height: 1.7; }
.bk-fmt { font-size: 12px; color: var(--muted); }
.bk-ans { display: flex; align-items: center; gap: 8px; margin-top: auto; }
.bk-ans label { font-size: 13px; font-weight: 600; }
.bk-ans input { flex: 1; min-width: 0; border: 0; border-bottom: 1.5px solid var(--ink); background: transparent; padding: 4px 2px; font-size: 15px; }
.bk-ans input:focus { outline: none; border-bottom-color: var(--accent); }
.bk-ans input:disabled { color: var(--mark); font-weight: 600; border-bottom-color: transparent; }
.bk-fb { font-size: 13px; color: var(--mark); background: var(--mark-soft); border-radius: 7px; padding: 6px 9px; }
.bk-tag { font-size: 12px; color: var(--t-step); font-weight: 600; }
.bk-item .act { align-self: flex-start; padding: 4px 10px; font-size: 12.5px; }
.bk-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 22px 18px; border-top: 1px solid var(--line); }
.bk-foot .lvdesc { margin-left: auto; }
.back { border: 0; background: none; color: var(--accent); font-size: 13.5px; font-weight: 600; padding: 0; margin-bottom: 8px; align-self: flex-start; }
@media (max-width: 820px) {
  .bk-grid { grid-template-columns: minmax(0, 1fr); }
  .bk-head, .bk-body, .bk-foot, .bk-score { padding-left: 14px; padding-right: 14px; }
  .bk-item { padding-left: 46px; }
}
.pad { position: relative; flex: none; width: 100%; height: clamp(360px, 58vh, 470px); background: var(--panel); border: 1.5px solid var(--accent); border-radius: 14px; box-shadow: 4px 4px 0 var(--accent-soft); display: flex; flex-direction: column; overflow: hidden; animation: padin .25s ease-out; }
@keyframes padin { from { transform: translateY(-8px); opacity: 0; } }
.pad .pad-q { display: none; }
.pad-tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; color: #fff; background: var(--accent); border-radius: 4px; padding: 2px 7px; }
.fab { position: fixed; z-index: 25; right: max(22px, env(safe-area-inset-right, 0px)); bottom: calc(118px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 12px 18px 12px 14px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; box-shadow: 0 10px 24px -8px color-mix(in srgb, var(--accent) 70%, transparent), 0 2px 0 rgba(0,0,0,.15); animation: fabin .3s ease-out; }
.fab:hover { transform: translateY(-1px); }
.fab svg { flex: none; }
@keyframes fabin { from { transform: scale(.7); opacity: 0; } }
.act.pad-btn { background: var(--accent); color: #fff; font-weight: 600; }
.act.pad-btn:hover { filter: brightness(1.08); background: var(--accent); }
.pad-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px 4px; }
.pad-head h3 { font-size: 15px !important; }
.pad-head h3 { font-family: var(--display); font-size: 19px; margin: 0; }
.pad-head .pno2 { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.pad-x { margin-left: auto; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 11px; font-size: 13px; }
.pad-q { margin: 0 14px; padding: 8px 12px; border-radius: 9px; background: var(--paper); font-size: 14px; line-height: 1.6; max-height: 110px; overflow-y: auto; }
.pad-tools { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; padding: 5px 12px 7px; }
.pad-tools .tool { height: 28px; min-width: 28px; padding: 0 7px; font-size: 12px; }
.tool { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; height: 32px; min-width: 32px; padding: 0 9px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 12.5px; }
.tool[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.tool .ink { width: 14px; height: 14px; border-radius: 50%; }
.tool.warn { color: var(--mark); border-color: var(--mark); }
.tools-gap { flex: 1; }
.pad-sheet { position: relative; flex: 1; min-height: 160px; margin: 0 12px; border-radius: 6px; border: 1px solid #DDE1EA; overflow: hidden; background: #FFFFFF; }
.pad-sheet canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.pad-hint0 { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; pointer-events: none; text-align: center; padding: 20px; }
.pad-bot { display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px 10px; }
.pad .bot { width: 38px; height: 38px; }
.pad .bot-say { font-size: 13px; padding: 6px 10px; }
.pad .bot-ctl .act { padding: 4px 8px; font-size: 12px; }
.pad .pad-bot { flex-wrap: wrap; }
.pad .bot-say { flex: 1 1 calc(100% - 50px); }
.pad .bot-say .nm > span:last-child { display: none; }
.pad .bot-ctl { flex-direction: row; align-items: center; width: 100%; order: 3; }
.tool .ink { box-shadow: 0 0 0 1.5px rgba(255,255,255,.75), 0 0 0 2.5px rgba(0,0,0,.15); }
.snd { flex-wrap: wrap; }
.snd button { white-space: nowrap; }
.bot { flex: none; }
.bot .eye { fill: #7FA2FF; transition: fill .2s; }
.bot[data-s="good"] .eye { fill: #4CD6A8; }
.bot[data-s="fix"] .eye, .bot[data-s="calc"] .eye { fill: #FF8B6B; }
.bot[data-s="think"] .eyes { animation: scan .7s ease-in-out infinite alternate; }
@keyframes scan { from { transform: translateX(-4px); } to { transform: translateX(4px); } }
.bot .bulb { fill: #E0604C; }
.bot[data-s="think"] .bulb { animation: pulse .5s infinite; }
.bot-say { flex: 1; min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 4px 12px 12px 12px; padding: 8px 12px; font-size: 14px; }
.bot-say .nm { font-weight: 600; font-size: 12.5px; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.bot-say .rd { font-size: 12px; color: var(--muted); margin-top: 4px; }
.bot-say .md p { margin: 0; }
.bot-ctl { display: flex; flex-direction: column; gap: 6px; flex: none; }
.bot-ctl .act { padding: 5px 10px; font-size: 12.5px; }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); border: 0; background: none; padding: 0; }
.switch i { width: 30px; height: 17px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--panel); transition: transform .2s; }
.switch[aria-checked="true"] i { background: var(--t-step); }
.switch[aria-checked="true"] i::after { transform: translateX(13px); }
@media (max-width: 820px) {
  .pad { height: clamp(360px, 62dvh, 460px); }

    if (sj) {
      if (p.lv === '고' && p.g === 3) ok = g === 3 && (sj === '수학Ⅰ' || sj === '수학Ⅱ' || subj.includes(sj));

      else if (p.lv === '고' && p.g === 2) ok = subj.includes(sj) || (sj === '대수' && subj.includes('미적분'));
      else ok = false;
    } else ok = rr < r || (rr === r && (p.lv === '고' && p.g >= 2 ? true : t <= p.t));
    if (ok) allowed.push(txt);
    else { later.push(`${txt} → ${lv}${g}${sj ? ' ' + sj : '-' + (t + 1)}에 배움`); if (re) banned.push(re); }

}
function symbolRule(p) {
  const S = symInfo(p);
  return `[기호 규칙 — 아주 중요]
이 학생은 ${LV[p.lv]} ${p.g}학년이야. 아래 "배운 기호"만 써.
- 배운 기호: ${S.allowed.join(' / ')}
- 아직 안 배운 기호(절대 쓰지 마. 꼭 필요하면 쉬운 말로 풀어 써): ${S.later.length ? S.later.join(' / ') : '없음'}
${S.elem ? '- 초등학생이니 문자 x, y, a 대신 □나 ○를 써. 곱셈은 × (· 금지), 나눗셈은 ÷. 음수, 거듭제곱 금지. 도형의 꼭짓점은 ㄱ, ㄴ, ㄷ으로 써. 같은 뜻이면 기호보다 말("~보다 커요")이 좋아.\n' : ''}- LaTeX는 배운 기호를 교과서처럼 보여 주는 데만 써. 처음 나오는 기호는 괄호로 읽는 법과 뜻을 붙여(예: $\\sqrt{2}$(루트 2, 제곱해서 2가 되는 수)).`;
}
// 안 배운 기호가 들어 있으면 그 기호 목록을 돌려줌
function symbolHits(text, p) {
  const S = symInfo(p), hits = new Set();
  const maths = (String(text).match(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$|\\\([\s\S]+?\\\)|\\\[[\s\S]+?\\\]/g) || []);
  const mathText = maths.join(' ');
  for (const re of S.banned) {
    if (re === 'VAR') {
      const cleaned = mathText.replace(/\\(text|mathrm)\{[^}]*\}/g, ' ').replace(/\\[a-zA-Z]+/g, ' ')
        .replace(/(cm|mm|km|kg|mL|ml|L|m|g|t)(\^\{?[23]\}?)?(?![a-zA-Z])/g, ' ');
      if (/[a-zA-Z]/.test(cleaned)) hits.add('문자(x, a 같은 글자)');
      if (/\^/.test(cleaned)) hits.add('거듭제곱');
      if (/(^|[=(,\s])\s*-\s*\d/.test(cleaned.replace(/\$/g, ' '))) hits.add('음수');
      if (/\\le|\\ge|≤|≥/.test(mathText)) hits.add('≤, ≥');
      if (/(^|[^가-힣a-zA-Z])[xy](?=[^a-zA-Z]|$)/.test(String(text).replace(/\$[^$]*\$/g, ''))) hits.add('문자 x, y');
      continue;
    }
    const m = (mathText + ' ' + text).match(re);
    if (m) hits.add(m[0].replace(/^\\/, ''));
  }
  return [...hits];
}
async function fixSymbols(text, p, signal) {
  const hits = symbolHits(text, p);
  if (!hits.length || !sample) return text;
  try {
    const r = await sample(`아래 글에 ${LV[p.lv]} ${p.g}학년 학생이 아직 배우지 않은 기호(${hits.join(', ')})가 들어 있어. 그 기호를 학생이 아는 기호나 쉬운 말로 바꿔서 글 전체를 다시 써. 수학 내용, 숫자, 계산 결과, 소제목 구조는 그대로. 바뀐 글만 써.

${symbolRule(p)}

[글]
${text}`, { cache: false, signal, modelTier: 'default' });
    return r.text;
  } catch (e) { if (e && e.code === 'cancelled') throw e; return text; }
}

/* 마크다운 + 수식 */
function renderMD(el, text, final) {
  if (pos.lv === '초') text = String(text).replace(/\\cdot/g, '\\times').replace(/(\d)\s*·\s*(\d)/g, '$1 × $2');
  const maths = [];
  let t = text
    .replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]/g, (_, a, b) => { maths.push({ d: true, s: a ?? b }); return `@@M${maths.length - 1}@@`; })
    .replace(/\$([^$\n]+?)\$|\\\(([\s\S]+?)\\\)/g, (_, a, b) => { maths.push({ d: false, s: a ?? b }); return `@@M${maths.length - 1}@@`; });
  t = t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  let html = window.marked ? marked.parse(t, { breaks: true }) : t.replace(/\n/g, '<br>');
  html = html.replace(/@@M(\d+)@@/g, (_, i) => { const m = maths[+i]; const s = esc(m.s); return m.d ? `<div class="mjx-block">\\[${s}\\]</div>` : `\\(${s}\\)`; });
  el.innerHTML = html;
  if (!final) return;
  // "정답" 제목 아래는 접어 두기
  const h = [...el.querySelectorAll('h2, h3, h4')].find(x => /정답/.test(x.textContent));
  if (h && h.parentNode === el) {
    const det = document.createElement('details'); const sum = document.createElement('summary');
    sum.textContent = h.textContent.trim() || '정답과 풀이 보기'; det.append(sum);
    let n = h; el.insertBefore(det, h);
    while (n) { const next = n.nextSibling; det.append(n); n = next; }
  }
  typeset(el);
}
function typeset(el) {
  const mj = window.MathJax;
  if (mj && mj.typesetPromise) {
    (mj.startup && mj.startup.promise ? mj.startup.promise : Promise.resolve()).then(() => mj.typesetPromise([el])).catch(() => {});
  } else setTimeout(() => typeset(el), 400);
}

${MAP_TEXT}

[가장 중요한 원칙]
A. 쉽게, 하지만 거짓말 없이. 나중에 고쳐야 하는 설명은 절대 하지 마. 예: "곱하면 항상 커진다", "작은 수에서 큰 수는 못 뺀다", "분수는 1보다 작다", "x²의 그래프는 U자일 뿐" 같은 말 대신, 지금 학년 범위에서 참이면서 나중에 그대로 넓어질 수 있는 설명을 해. (예: "지금은 자연수끼리만 다뤄서 그래요. 중1 때 음수를 배우면 뺄 수 있게 돼요.")
B. 공식은 '왜'부터. 외우게 하지 말고 그림·비유·작은 예로 원리를 보여 준 뒤 공식으로 정리해. 원리를 알면 공식을 잊어도 다시 만들 수 있게.

D. 정확성이 최우선. 계산은 답을 쓰기 전에 다른 방법으로 한 번 더 검산해. 한국 교과서의 정확한 용어와 정의를 써(예: 최대공약수, 기약분수, 근의 공식, 판별식). 확실하지 않은 건 확실하지 않다고 말해.
E. 학년 범위를 지켜. 아직 안 배운 기호·방법(예: 초등학생에게 미지수 x·음수, 중학생에게 미분)으로 풀지 말고 그 학년 방법으로 풀어. 더 빠른 상위 방법이 있으면 "나중에 ○○에서 더 쉽게 푸는 방법을 배워요"라고만 알려 줘.

[개념을 물어볼 때 답의 모양]
**한 줄 핵심** — 가장 쉬운 말로 한 문장.
**왜 그럴까?** — 그림을 떠올릴 수 있는 비유나 작은 예로 원리를 보여 줘.
**예시로 보기** — 대표 예 1~2개를 번호 단계로 풀이.
**이렇게 이어져요** — 뒤에 배울 단원 1~3개와 연결(원칙 C). 짧게.
**확인 문제** — 이해를 확인하는 문제 1개. 답은 맨 끝 "### 정답과 풀이" 아래에.
(단순 계산이나 짧은 질문이면 형식을 줄여서 짧게 답해도 돼.)

[그 밖의 규칙]
1. 한국어, 친근한 존댓말(~해요).
2. 수식은 LaTeX: 문장 안은 $...$, 한 줄 전체는 $$...$$. 표가 도움이 되면 마크다운 표를 써.${young ? '\n3. 1~2학년이니 기호는 최소로, 사과·사탕·블록 같은 물건으로 설명하고 문장은 아주 짧게.' : ''}
4. 문제를 낼 때는 문제를 먼저 모두 쓰고, 정답과 풀이는 맨 끝 "### 정답과 풀이" 제목 아래에 모아 써.
5. 학생이 답이나 풀이를 보내면 맞았는지 먼저 말하고, 틀렸으면 어느 단계의 어떤 생각이 틀렸는지 짚고 올바른 생각으로 고쳐 줘. 실수의 원인이 앞 학년 개념이면 그 단원을 알려 줘.
6. 문제 사진이 오면 먼저 문제를 정확히 옮겨 적고, 위 원칙대로 풀어 줘. 글씨가 잘 안 보이면 다시 찍어 달라고 해.
7. 수학과 상관없는 질문은 짧게 답하고 수학 공부로 돌아오게 해.`;
}

async function ask(text) {
  text = (text || '').trim();
  if (busy || (!text && !pendingImg)) return;
  if (!sample) { setStatus('AI 선생님은 claude.ai에서 열었을 때만 대답해요.', true); return; }
  const k = keyOf(pos);
  const list = chats.get(k) || []; chats.set(k, list);
  const img = pendingImg;
  const userMsg = { role: 'user', content: text || '이 사진 속 문제를 풀어 주세요.' };
  if (img) userMsg.img = img.url;
  list.push(userMsg);
  clearAttach(); $('input').value = ''; autosize();

  const log = $('log');
  if (log.querySelector('.welcome')) log.replaceChildren();
  log.append(msgEl(userMsg));
  const meet = mode === 'deep';
  const box = document.createElement('div'); box.className = 'msg ai';
  box.innerHTML = whoHTML('main', MAIN_NAME, 'Claude', true) +
    (meet ? `<div class="meeting"><div class="stage">AI 회의 중</div>${TEACHERS.map(t => seatHTML(t.id, t.name, t.engine)).join('')}${seatHTML('judge', '심사 · 최고 답 고르기', 'Claude Opus').replace('data-k="judge">' + face('judge', 34), 'data-k="judge">' + face('main', 34))}${seatHTML('easy', '제일 쉽게 바꾸기', 'Claude Sonnet').replace('data-k="easy">' + face('easy', 34), 'data-k="easy">' + face('main', 34))}</div>` : '') +
    '<div class="md"><span class="thinking">생각하는 중…</span></div>';
  log.append(box); scrollEnd();
  const md = box.querySelector('.md');

  setBusy(true); setStatus('');
  ctl = new AbortController(); const signal = ctl.signal;
  const turns = list.slice(-12).map(m => ({ role: m.role, content: m.role === 'user' && m.img ? m.content + '\n(문제 사진을 함께 보냈어요)' : m.content }));
  while (turns.length && turns[0].role !== 'user') turns.shift();
  const imgs = img && canImg ? [img.blob] : null;
  const base = rules();

  let raf = 0, latest = '';
  const stream = ({ text }) => { latest = text; if (!raf) raf = requestAnimationFrame(() => { raf = 0; renderMD(md, latest, false); scrollEnd(); }); };
  const aiMsg = { role: 'assistant', content: '' };
  const fail = e => {
    const code = e && e.code;
    if (code === 'cancelled') return '여기서 멈췄어요.';
    const msg = ERR[code] || '연결이 잠깐 끊겼어요. 다시 보내 주세요.';
    setStatus(msg, true);
    if (code === 'not_granted' || code === 'sampling_disabled') sample = null;
    return msg;
  };

  try {
    if (!meet) {
      const res = await sample([{ role: 'user', content: base }, ...turns], { cache: false, signal, onText: stream, modelTier: 'default', ...(imgs ? { images: imgs } : {}) });
      aiMsg.content = res.text;
      if (symbolHits(aiMsg.content, pos).length) { md.innerHTML = '<span class="thinking">아직 안 배운 기호를 쉬운 기호로 바꾸는 중…</span>'; aiMsg.content = await fixSymbols(aiMsg.content, pos, signal); }
      if (res.truncated) aiMsg.note = '답이 길어서 중간에 끊겼어요. "이어서 설명해 주세요"라고 보내 보세요.';
    } else {
      // 1) 선생님들이 각자 초안을 씀
      md.innerHTML = '<span class="thinking">선생님들이 각자 답을 쓰는 중… (1분쯤 걸려요)</span>';
      const drafts = TEACHERS.map(t => ({ id: t.id, name: t.name, engine: t.engine, text: '' }));
      const results = await Promise.allSettled(TEACHERS.map((t, i) => {
        setSeat(box, t.id, 'run', '답 쓰는 중');
        return callAI(t, [{ role: 'user', content: base + '\n\n[AI 회의에서 너의 역할]\n' + t.role + '\n이 답은 다른 선생님 답과 비교·심사돼. 정확하고 충실하게 써.' }, ...turns],
          { cache: false, signal, ...(imgs ? { images: imgs } : {}) })
          .then(r => {

            setSeat(box, t.id, 'done', '초안 완성'); return r; },
                e => { setSeat(box, t.id, 'fail', e && e.code === 'cancelled' ? '멈춤' : '참여 못 함'); throw e; });
      }));
      if (signal.aborted) throw { code: 'cancelled' };
      const ok = drafts.filter(d => d.text);
      if (!ok.length) throw (results.find(r => r.status === 'rejected') || {}).reason || { code: 'upstream_error' };
      aiMsg.panel = { drafts };

          `[AI 회의 · 심사]\n위 질문에 대해 선생님 ${ok.length}명이 쓴 초안이 아래에 있어. 너는 심사 선생님이야.\n` +
          `1) 모든 계산과 결론을 직접 다시 검산해. 초안끼리 다르면 누가 맞는지 근거를 가지고 판단해.\n` +
          `2) 틀린 내용, 학년 범위를 벗어난 방법, 나중에 고쳐야 하는 설명은 버려.\n` +
          `3) 가장 좋은 원리 설명, 가장 깔끔한 풀이, 가장 중요한 주의점, 가장 정확한 단원 연결만 골라 하나의 최고 답안으로 합쳐.\n` +
          `4) 답안만 써. 심사 과정이나 "선생님 A는…" 같은 말은 쓰지 마. 답의 모양 규칙은 그대로 지켜.\n\n` +
          ok.map(d => `===== ${d.name} 초안 =====\n${d.text}`).join('\n\n') }],
          { cache: false, signal, modelTier: 'complex', effort: 'high' });
        best = r.text; setSeat(box, 'judge', 'done', '최고 답 결정');
      } catch (e) {
        if (e && e.code === 'cancelled') throw e;
        best = (drafts.find(d => d.id === 'idea' && d.text) || ok[0]).text;

      }
      aiMsg.panel.best = best;

      // 3) 제일 쉽게 바꾸기
      setSeat(box, 'easy', 'run', '쉽게 바꾸는 중');
      md.innerHTML = '<span class="thinking">제일 쉬운 말로 바꾸는 중…</span>';
      try {
        const who = `${LV[pos.lv]} ${pos.g}학년`;
        const r = await sample(

   푸는 동안에는 채점하지 않아요. 다 풀고 "제출하기"를 누르면 선생님이 한꺼번에 채점하고 점수를 써 줘요. */
const setOf = s => (s.mode === 'book' ? s.book : s.one);
const isDone = it => it.result === 'right' || it.result === 'fixed';
function itemCur(it, i) {
  if (!it.cur) it.cur = { ...it.p, level: it.level, tries: 0, hintsShown: 0, solved: false };
  it.cur.no = i + 1; it.cur.idx = i; it.cur.solved = isDone(it); if (it.cur.solved) it.cur.solvedWith = it.ans;
  if (!it.thread) it.thread = [{ role: 'assistant', kind: 'start', content: (it.fb ? it.fb + '\n\n' : '') + it.p.start }];
  return it.cur;
}
function syncCur(s) {
  const set = setOf(s), i = s.mode === 'book' ? s.focus : s.oneAt;
  if (set && i != null && set.items[i]) { const it = set.items[i]; s.cur = itemCur(it, i); s.thread = it.thread; s.item = it; s.set = set; }
  else { s.cur = null; s.thread = []; s.item = null; s.set = set || null; }
}
function openItem(i) { const s = pst(); if (s.mode === 'book') s.focus = i; else s.oneAt = i; s.err = ''; renderLog(); }
function backToSheet() { const s = pst(); if (s.mode === 'book') s.focus = null; else s.oneAt = null; s.err = ''; renderLog(); }
const newSet = (plan, cat) => ({ items: [], graded: false, grading: false, plan, cat, made: new Date().toLocaleDateString('ko-KR'), missing: 0, round: 0, first: null, comment: '' });

async function newProblem() {
  if (!sample) { setStatus('문제는 claude.ai에서 이 페이지를 열었을 때 만들어져요.', true); return; }
  const p = { ...pos }, k = keyOf(p), s = pst(k), cat = s.cat, level = s.level, qk = `${k}|${cat}|${level}`;
  if (s.waiting) return;
  if (s.one && s.one.graded) { s.one = null; s.oneAt = null; }      // 제출한 세트는 끝! 새 세트를 시작해요
  s.err = '';
  const here = () => keyOf(pos) === k && view === 'practice' && s.mode === 'one';
  if (!(QUEUE.get(qk) || []).length) {
    s.waiting = qk; if (here()) { renderPbar(); renderLog(); }
    try {
      const batch = ensureGen(p, cat, level);
      const quick = level <= 3 ? ensureGen(p, cat, level, true) : null;
      // 먼저 끝난 쪽에서 문제가 나오면 바로 보여 줘요
      await new Promise((res, rej) => {
        let left = quick ? 2 : 1, lastErr = null;
        const done = () => { if ((QUEUE.get(qk) || []).length) res(); else if (--left <= 0) rej(lastErr || { code: 'empty_completion' }); };
        [batch, quick].filter(Boolean).forEach(pr => pr.then(done, e => { lastErr = e; done(); }));
      });
    } catch (e) {
      s.waiting = false; s.err = ERR[e && e.code] || '문제를 만들지 못했어요. 다시 눌러 주세요.';
      if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled')) sample = null;
      if (here()) { renderPbar(); renderLog(); } return;
    }
  }
  s.waiting = false;
  const q = QUEUE.get(qk) || [], pb = q.shift();
  if (!pb) { s.err = '문제를 만들지 못했어요. 다시 눌러 주세요.'; if (here()) { renderPbar(); renderLog(); } return; }
  if (!s.one) s.one = newSet('one', cat);
  s.one.items.push({ p: pb, level, ans: '', result: null, fb: '' });
  s.oneAt = s.one.items.length - 1;
  s.justNew = true; SND.flip();
  markSeen(k, pb.question);
  if (q.length < 2) ensureGen(p, cat, level).catch(() => {});   // 다음 문제를 미리 준비해 둬요
  if (here()) { renderPbar(); renderLog(); setTimeout(() => { const i = document.getElementById('ansIn'); i && i.focus({ preventScroll: true }); }, 50); }
}
function nextOne() {
  const s = pst(), set = s.one; if (!set) return newProblem();
  if (s.oneAt != null && s.oneAt < set.items.length - 1) { s.oneAt++; s.justNew = true; SND.flip(); renderLog(); }
  else newProblem();
}

/* ---------- 문제집 ---------- */
async function makeBook() {
  if (!sample) { setStatus('문제집은 claude.ai에서 이 페이지를 열었을 때 만들어져요.', true); return; }
  const p = { ...pos }, k = keyOf(p), s = pst(k);
  if (s.bookWaiting) return;
  s.focus = null;
  const plan = s.bookPlan, size = s.bookSize, cat = s.cat;
  const levels = plan === 'step' ? BOOK_PLAN[size] : Array(size / 3).fill(plan);
  const subs = DATA[p.lv][p.g][p.t].units[p.u].subs;
  s.err = ''; s.bookWaiting = { done: 0, total: levels.length };
  const here = () => keyOf(pos) === k && view === 'practice' && s.mode === 'book';
  if (here()) { renderPbar(); renderLog(); }
  const results = await Promise.allSettled(levels.map((lv, i) => {
    const focus = cat < 0 ? `소단원 '${subs[i % subs.length]}'${subs.length > 1 ? `, '${subs[(i + 1) % subs.length]}'` : ''} 위주로 내.` : '';
    const extra = `이 3문제는 문제집에 들어갈 ${levels.length}묶음 중 ${i + 1}번째 묶음이야. ${focus} 다른 묶음과 유형·상황 소재가 겹치지 않게 해. 무작위 수와 소재를 꼭 새로 골라.`;
    return genProblems(p, cat, lv, `book:${k}:${i}`, '', extra).then(list => {
      s.bookWaiting.done++; const el = document.getElementById('bookProg'); if (el) el.textContent = `${s.bookWaiting.done} / ${levels.length} 단계 완성`;
      return list.map(x => ({ p: x, level: lv }));
    });
  }));
  const seenQ = new Set(); const items = [];
  results.forEach(r => { if (r.status === 'fulfilled') r.value.forEach(it => { const n = norm(it.p.question); if (!seenQ.has(n)) { seenQ.add(n); items.push(it); } }); });
  s.bookWaiting = null;
  if (!items.length) {
    const e = (results.find(r => r.status === 'rejected') || {}).reason;
    s.err = ERR[e && e.code] || '문제집을 만들지 못했어요. 다시 눌러 주세요.';
    if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled')) sample = null;
  } else {
    items.sort((a, b) => a.level - b.level);
    items.forEach(it => { it.ans = ''; it.result = null; it.fb = ''; markSeen(k, it.p.question); });
    s.book = { ...newSet(plan, cat), items, missing: levels.length * 3 - items.length };
    SND.flip(); setTimeout(() => SND.flip(), 160);
  }
  if (here()) { renderPbar(); renderLog(); }
}

// 선생님이 써 주는 점수와 한마디
function gradeBlock(b) {
  const total = b.items.length, right = b.items.filter(isDone).length, now = Math.round(right / total * 100);
  const el = document.createElement('div'); el.className = 'grade';
  el.innerHTML = `<div class="grade-score" aria-label="점수 ${b.first}점"><span class="pts">${b.first}</span><span class="unit">점</span></div>
<div class="grade-talk">${face('main', 46)}<div class="bubble"><div class="who2">${MAIN_NAME}의 한마디</div><div class="md"></div><div class="grade-sub">${total}문제 중 ${b.firstRight}문제 맞힘${now !== b.first ? ` · 고친 뒤 <b>${now}점</b>` : ''}</div></div></div>`;
  renderMD(el.querySelector('.md'), b.comment || (b.first === 100 ? '전부 맞혔어요! 정말 잘했어요.' : '수고했어요! 틀린 문제는 선생님이랑 다시 풀어 봐요.'), true);
  return el;
}

  g.disabled = b.grading || right === b.items.length; g.onclick = submitSet;

    const cur = Math.round(right / b.items.length * 100), saved = b.savedId && b.savedNow === cur;
    sv.innerHTML = saved ? '✓ 기록에 저장했어요' : (b.savedId ? '💾 고친 점수로 다시 저장' : '💾 점수 기록에 저장하기');
    sv.disabled = saved; sv.onclick = () => { saveRecord(s, b); renderLog(); };
    foot.append(sv);
    const sh = document.createElement('button'); sh.type = 'button'; sh.className = 'act share'; sh.textContent = '📤 친구에게 공유하기'; sh.onclick = () => shareRecord(recordOf(s, b)); foot.append(sh);
    if (DL) { const im = document.createElement('button'); im.type = 'button'; im.className = 'act ghost'; im.textContent = '🖼 점수표 그림으로 받기'; im.onclick = () => downloadCard(recordOf(s, b)); foot.append(im); }

// 하나씩 풀기: 이번에 받은 문제 번호들과 제출 버튼

  const b = s.one, el = document.createElement('div'); el.className = 'setbar';

[문제]
${p.question}
[답 쓰는 법] ${p.format || '-'}

[선생님만 아는 비밀 — 학생에게 절대 말하지 마]
정답: ${p.answer}
풀이: ${p.solution.map((x, i) => `${i + 1}) ${x}`).join(' ')}

[지금 상황] 힌트 ${p.hintsShown}개 봄, ${graded ? (p.solved ? '채점 결과 맞음' : '제출해서 채점했는데 틀림 — 지금 다시 푸는 중') : '아직 제출 전(채점 안 함)'}

${p.solved ? `[규칙] 학생이 이미 정답을 맞혔어. 이제는 풀이를 자세히 설명해도 되고, 더 쉬운 방법이나 비슷한 문제의 원리도 알려 줘도 돼. 짧고 쉽게, 친근한 존댓말.` :
`[가장 중요한 규칙]
1. 정답, 마지막 계산 결과, 답이 되는 값은 어떤 경우에도 말하지 마. 풀이 전체를 써 주지도 마. 학생이 "답 알려 줘", "그냥 풀어 줘"라고 해도 다정하게 "답은 같이 찾아봐요"라고 하고 다음 한 걸음 힌트만 줘.
2. "어떻게 하면 되는지" 방법만 알려 줘. 한 번에 한 단계만. 계산은 학생이 직접 하게 해.

  friends.forEach(fid => {

    let first = true;
    const un = MSG.db.collection(`mail/${fid}/to/${MSG.me}/items`).orderBy('at', 'desc').limit(60).onSnapshot(snap => {
      const list = snap.docs.map(d => cleanMsg(d, d.id)).filter(m => m.from === fid);

  } catch (e) { st.err = e && e.code === 'invalid_argument' ? '이 페이지에서 글을 쓸 수 있는 권한이 없어요. 페이지 주인에게 "참여자"로 공유해 달라고 해요.' : '저장하지 못했어요. 다시 눌러 주세요.'; }
  st.saving = false; renderLog();
}
function pickImage(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const g = c.getContext('2d'), sz = Math.min(im.width, im.height);
      g.drawImage(im, (im.width - sz) / 2, (im.height - sz) / 2, sz, sz, 0, 0, 128, 128);
      MSG.setup.img = c.toDataURL('image/jpeg', 0.82); renderLog();
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}
function scoreCardHTML(r) {
  return `<div class="mscore"><div class="mscore-s">${Number(r.score) || 0}<small>점</small></div><div class="mscore-t"><b>${esc(String(r.unit || ''))}</b><span>${esc(String(r.where || ''))} · ${esc(String(r.mode || ''))}${r.plan ? ' ' + esc(String(r.plan)) : ''}</span><span>${Number(r.total) || 0}문제 중 ${Number(r.firstRight ?? r.right) || 0}문제 맞힘${Number(r.now) !== Number(r.score) ? ` · 고친 뒤 ${Number(r.now) || 0}점` : ''}</span>${r.comment ? `<i>“${esc(String(r.comment).slice(0, 140))}”</i>` : ''}</div></div>`;
}
function renderMsg() {
  const log = $('log'); log.replaceChildren();

  const hello = (title, body) => { wrap.innerHTML = `<div class="hello">${face('main', 64)}<div class="bubble"><b>${title}</b><p>${body}</p></div></div>`; };
  if (MSG.state === 'off') return hello('메시지는 claude.ai에서 열었을 때 쓸 수 있어요', '친구도 이 페이지를 claude.ai에서 열어야 해요. 이 페이지 주인이 공유 메뉴에서 친구를 "참여자"로 초대하면 같이 메시지를 주고받을 수 있어요.');
  if (MSG.state === 'loading') return hello('메시지함을 여는 중…', '잠깐만 기다려 주세요.');

  if (MSG.state === 'error') return hello('메시지함을 열 수 없어요', '페이지를 새로 열어 주세요.');
  if (!MSG.profile || MSG.editing) return renderSetup(wrap);
  // 새 메시지 알림
  const senders = [...MSG.inbox.keys()].filter(f => unreadOf(f)).sort((a, b) => ((MSG.inbox.get(b) || [])[0]?.at || 0) - ((MSG.inbox.get(a) || [])[0]?.at || 0));
  if (senders.length) {
    const al = document.createElement('div'); al.className = 'malert';
    al.innerHTML = `<span class="ic">📬</span><span>${senders.map(f => `<button type="button" data-f="${esc(f)}">${avatarOf(MSG.profiles.get(f), 20)}<b>${esc(handleOf(f))}</b>님 ${unreadOf(f)}개</button>`).join('')}에게서 새 메시지가 왔어요</span>`;
    al.querySelectorAll('button').forEach(b => b.onclick = () => openThread(b.dataset.f));
    wrap.append(al);
  }
  const app = document.createElement('div'); app.className = 'msgapp' + (MSG.sel ? ' has-sel' : ''); wrap.append(app);
  // 왼쪽: 내 프로필 + 친구 목록
  const side = document.createElement('div'); side.className = 'mside';
  side.innerHTML = `<div class="mme">${avatarOf(MSG.profile, 44)}<div><b>${esc(MSG.profile.handle)}</b><span>내 아이디</span></div><button type="button" class="act ghost">프로필 바꾸기</button></div><input class="search" id="mq" type="search" placeholder="친구 아이디 찾기" autocomplete="off"><div class="mlist"></div>`;
  side.querySelector('.mme button').onclick = () => { MSG.editing = true; const p = MSG.profile; MSG.setup = { handle: p.handle, avatar: Number(p.avatar.slice(2)) || 0, img: p.img || null, err: '' }; renderLog(); };
  const q = side.querySelector('#mq'); q.value = MSG.q; q.oninput = () => { MSG.q = q.value; renderFriendList(side.querySelector('.mlist')); };
  renderFriendList(side.querySelector('.mlist'));
  app.append(side);
  // 오른쪽: 대화
  const chat = document.createElement('div'); chat.className = 'mchat'; app.append(chat);
  if (!MSG.sel) { chat.innerHTML = `<div class="mempty">${avatarOf(MSG.profile, 72)}<p>왼쪽에서 친구를 골라 메시지를 보내 보세요.<br>채점지의 <b>📤 친구에게 공유하기</b>로 점수표도 보낼 수 있어요.</p></div>`; return; }
  const fid = MSG.sel, fp = MSG.profiles.get(fid);
  const msgs = [...(MSG.inbox.get(fid) || []), ...(MSG.sent.get(fid) || [])].sort((a, b) => a.at - b.at);
  chat.innerHTML = `<div class="mhead"><button type="button" class="mback" aria-label="친구 목록으로">←</button>${avatarOf(fp, 34)}<b>${esc(handleOf(fid))}</b></div><div class="mbody" id="mbody"></div><form class="mform"><input id="mtext" autocomplete="off" maxlength="500" placeholder="${esc(handleOf(fid))}에게 메시지 보내기"><button class="send" type="submit">보내기</button></form>${MSG.err ? `<div class="note" style="padding:0 12px 8px">${esc(MSG.err)}</div>` : ''}`;
  chat.querySelector('.mback').onclick = () => { MSG.sel = null; watchSent(null); renderLog(); };
  const body = chat.querySelector('#mbody');
  if (!msgs.length) body.innerHTML = `<div class="mempty small">아직 주고받은 메시지가 없어요. 먼저 인사해 볼까요? 👋</div>`;
  let lastDay = '';
  msgs.forEach(m => {
    const day = new Date(m.at).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
    if (day !== lastDay) { lastDay = day; const dd = document.createElement('div'); dd.className = 'mday'; dd.textContent = day; body.append(dd); }
    const mine = m.from === MSG.me, row = document.createElement('div'); row.className = 'mrow' + (mine ? ' mine' : '');
    row.innerHTML = `${mine ? '' : avatarOf(fp, 28)}<div class="mb">${m.kind === 'score' && m.rec ? scoreCardHTML(m.rec) : ''}${m.text ? `<div class="mt2"></div>` : ''}</div><span class="mtime">${fmtTime(m.at)}</span>`;

    body.append(row);
  });
  const inp = chat.querySelector('#mtext'); inp.value = MSG.draft; inp.oninput = () => { MSG.draft = inp.value; };
  chat.querySelector('.mform').onsubmit = async e => {
    e.preventDefault(); const text = inp.value.trim(); if (!text) return;
    MSG.draft = ''; inp.value = '';
    const ok = await sendMsg(fid, { kind: 'text', text });
    if (!ok) MSG.draft = text;
    renderLog(); const ni = document.getElementById('mtext'); ni && ni.focus();
  };
  requestAnimationFrame(() => { body.scrollTop = body.scrollHeight; if (document.activeElement === document.body) inp.focus({ preventScroll: true }); });
}
function renderFriendList(el) {
  const q = MSG.q.trim().toLowerCase();
  const last = f => Math.max((MSG.inbox.get(f) || [])[0]?.at || 0, (MSG.sent.get(f) || [])[0]?.at || 0);
  const fr = [...MSG.profiles.entries()].filter(([id, p]) => id !== MSG.me && (!q || p.handle.toLowerCase().includes(q))).sort((a, b) => unreadOf(b[0]) - unreadOf(a[0]) || last(b[0]) - last(a[0]) || a[1].handle.localeCompare(b[1].handle));
  el.replaceChildren();
  if (!fr.length) { el.innerHTML = `<div class="mempty small">${q ? '그런 아이디를 가진 친구가 없어요.' : '아직 친구가 없어요. 이 페이지를 친구에게 공유하고, 친구도 아이디를 만들면 여기에 나와요.'}</div>`; return; }
  fr.forEach(([id, p]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'mf' + (MSG.sel === id ? ' on' : '');
    const lm = (MSG.inbox.get(id) || [])[0], n = unreadOf(id);
    b.innerHTML = `${avatarOf(p, 38)}<span class="mfx"><b>${esc(p.handle)}</b><small></small></span>${n ? `<span class="mfn">${n}</span>` : ''}`;
    b.querySelector('small').textContent = lm ? (lm.kind === 'score' ? `📄 점수표 ${lm.rec ? (Number(lm.rec.score) || 0) + '점' : ''}` : lm.text) : '메시지 보내기';
    b.onclick = () => openThread(id);
    el.append(b);
  });
}
function openThread(fid) {
  if (view !== 'msg') { view = 'msg'; try { localStorage.setItem('mc-view', view); } catch { } renderHead(); }
  MSG.sel = fid; MSG.draft = ''; MSG.err = ''; watchSent(fid); markSeen2(fid); renderLog();
}
function renderSetup(wrap) {
  const st = MSG.setup, first = !MSG.profile;
  const card = document.createElement('div'); card.className = 'msetup';
  card.innerHTML = `<div class="hello" style="margin:0">${face('main', 56)}<div class="bubble"><b>${first ? '메시지를 쓰려면 아이디를 만들어요' : '프로필 바꾸기'}</b><p>로그인은 필요 없어요. 친구들이 나를 찾을 아이디와 프로필 그림만 정하면 돼요.</p></div></div>
<div class="mset-row"><div class="mset-prev">${avatarOf({ avatar: 'd:' + st.avatar, img: st.img }, 96)}</div><div class="mset-f"><label class="label" for="mhandle">아이디</label><input class="search" id="mhandle" maxlength="12" autocomplete="off" placeholder="예: 수학왕건우"><span class="lvdesc">2~12글자 · 한글, 영어, 숫자, _</span></div></div>
<span class="label">기본 프로필 그림</span><div class="avgrid"></div>
<div class="mset-up"><label class="act ghost" for="mfile">📷 내 사진 넣기</label><input type="file" id="mfile" accept="image/*" hidden>${st.img ? '<button type="button" class="act ghost" id="mnoimg">사진 빼기</button>' : ''}<span class="lvdesc">사진은 작게 줄여서 저장돼요. 이 페이지를 볼 수 있는 사람은 모두 볼 수 있어요.</span></div>
${st.err ? `<div class="note">${esc(st.err)}</div>` : ''}
${!MSG.canWrite ? '<div class="note">지금은 이 페이지를 보기만 할 수 있어요. 메시지를 쓰려면 페이지 주인이 공유 메뉴에서 "참여자"로 바꿔 줘야 해요.</div>' : ''}
<div class="pbtns"><button type="button" class="act submit" id="msave">${st.saving ? '저장하는 중…' : first ? '시작하기' : '저장하기'}</button>${first ? '' : '<button type="button" class="act ghost" id="mcancel">취소</button>'}</div>`;
  const g = card.querySelector('.avgrid');
  AVATARS.forEach(([name], i) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'avpick'; b.title = name; b.setAttribute('aria-pressed', !st.img && st.avatar === i ? 'true' : 'false'); b.innerHTML = avatarSVG(i, 48) + `<small>${name}</small>`; b.onclick = () => { st.avatar = i; st.img = null; renderLog(); }; g.append(b); });
  const h = card.querySelector('#mhandle'); h.value = st.handle; h.oninput = () => { st.handle = h.value; };
  card.querySelector('#mfile').onchange = e => pickImage(e.target.files[0]);
  const ni = card.querySelector('#mnoimg'); if (ni) ni.onclick = () => { st.img = null; renderLog(); };

}
// 점수표 공유하기: 친구를 골라 보내요
const SHARE = { rec: null, note: '', sentTo: new Set() };
function shareRecord(rec) {
  if (MSG.state !== 'ready') { toast('<span>공유는 claude.ai에서 열었을 때 할 수 있어요</span>'); return; }
  if (!MSG.profile) { toast('<span>먼저 메시지 탭에서 아이디를 만들어요</span>'); view = 'msg'; try { localStorage.setItem('mc-view', view); } catch { } renderHead(); renderLog(); return; }
  SHARE.rec = rec; SHARE.note = ''; SHARE.sentTo = new Set();
  $('shareBg').hidden = false; renderShare();
}
function renderShare() {
  const box = $('shareBox'), r = SHARE.rec;
  box.innerHTML = `<div class="shop-head"><h3>📤 친구에게 공유하기</h3><button type="button" class="x">닫기</button></div><div style="padding:0 18px 10px">${scoreCardHTML(r)}<input class="search" id="snote" maxlength="200" placeholder="한마디 같이 보내기 (안 써도 돼요)" style="margin-top:10px"></div><div class="rec-list" id="slist"></div>`;
  box.querySelector('.x').onclick = () => { $('shareBg').hidden = true; };
  const n = box.querySelector('#snote'); n.value = SHARE.note; n.oninput = () => { SHARE.note = n.value; };
  const list = box.querySelector('#slist');
  const fr = [...MSG.profiles.entries()].filter(([id]) => id !== MSG.me);
  if (!fr.length) { list.innerHTML = '<div class="rec-empty">아직 친구가 없어요. 이 페이지를 친구에게 공유하고, 친구가 아이디를 만들면 여기에 나와요.</div>'; return; }
  fr.forEach(([id, p]) => {
    const row = document.createElement('div'); row.className = 'mf static';
    row.innerHTML = `${avatarOf(p, 36)}<span class="mfx"><b>${esc(p.handle)}</b></span>`;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'act' + (SHARE.sentTo.has(id) ? ' save' : '');
    b.textContent = SHARE.sentTo.has(id) ? '✓ 보냈어요' : '보내기'; b.disabled = SHARE.sentTo.has(id);
    b.onclick = async () => {
      b.disabled = true; b.textContent = '보내는 중…';
      const { items, ...summary } = r;
      const ok = await sendMsg(id, { kind: 'score', text: SHARE.note.trim().slice(0, 200), rec: summary });
      if (ok) { SHARE.sentTo.add(id); toast(`${avatarOf(p, 22)}<b>${esc(p.handle)}</b><span>에게 점수표를 보냈어요</span>`); } else toast(`<span>${esc(MSG.err)}</span>`);
      renderShare();
    };
    row.append(b); list.append(row);
  });
}
$('shareBg').addEventListener('click', e => { if (e.target.id === 'shareBg') $('shareBg').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('shareBg').hidden) $('shareBg').hidden = true; });

const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme(t, anim) {
  const root = document.documentElement;
  if (anim) { root.classList.add('theme-anim'); setTimeout(() => root.classList.remove('theme-anim'), 450); }
  if (t) root.dataset.theme = t; else delete root.dataset.theme;
  const dark = isDark(), b = $('themeBtn');
  b.innerHTML = (dark ? SUN + '<span>화이트 모드</span>' : MOON + '<span>야간 모드</span>');

}
