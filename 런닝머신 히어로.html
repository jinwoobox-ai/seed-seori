<script>

const GR="ABCDEFGHIJKLMNOPQRSTUVWXYZ",CAT=[["face","얼굴"],["body","몸"],["arm","팔"],["leg","다리"],["shoe","신발"]];

const RW=[...GR].map((_,g)=>.88**g),RS=RW.reduce((a,b)=>a+b),bon=g=>.02*(g+1),gcol=g=>hc(g*14,.8,.5),pf=g=>{const p=RW[g]/RS*100;return (p>=1?p.toFixed(1):p.toFixed(2))+"%"};
const mk=(k,g)=>{const ci=CAT.findIndex(c=>c[0]==k),h=g*41+ci*70,n=GR[g]+"급 "+CAT[ci][1];
 return k=="face"?[n,g,hc(h,.5,.25),hc(h+180,.8,.6),g%5]:k=="body"?[n,g,hc(h,.7,.5),hc(h+180,.8,.7),g%2]:k=="arm"?[n,g,g%3?hc(h,.6,.5):0,g%2?hc(h+60,.7,.5):0,3.3+g%4]:k=="leg"?[n,g,g%3==1?hc(h,.6,.4):0,hc(h+90,.7,.45)]:[n,g,hc(h,.8,.55),g>17?1:0]};

const armS=(s,a,h,r)=>{const f=s==2?dk:x=>x;return `<circle cx="57" cy="40" r="4.8" fill="${f(a)}"/>`+ln("ua"+s,f(a),7.8)+ln("fa"+s,f(a),6.2)+`<circle class="el${s}" r="3.5" fill="${f(a)}"/><circle class="hd${s}" r="${r}" fill="${f(h)}"/>`};

 return `<g class="ru">${armS(2,ak,ah,A[4])}${legS(2,lk,G[3],H[2],H[3])}

<ellipse cx="58" cy="23" rx="1.8" ry="2.6" fill="#e0a77c"/><ellipse cx="66.5" cy="22" rx="1.6" ry="2" fill="#fff"/><circle cx="67" cy="22" r="1.1" fill="#111"/>

 const leg=(s,ph)=>{const a=.85*Math.sin(ph),b=a-(.2+Math.max(0,Math.cos(ph))),kx=hx+Math.sin(a)*24,ky=hy+Math.cos(a)*24,ax=kx+Math.sin(b)*24,ay=ky+Math.cos(b)*24,fb=Math.max(-.6,Math.min(.3,b*.35));

 leg(1,p);leg(2,p+Math.PI);arm(1,p);arm(2,p+Math.PI);
 q("pn").setAttribute("d",`M54 16Q${46-Math.sin(p)*3} 12 ${41-Math.sin(p+1)*4} ${26+Math.cos(p)*3}`);

const OPP=[
["거북이",2,60,()=>lg([34,44,62,72],48,12,8,"#6cb86c")+E(86,40,10,7,"#6cb86c")+eye(90,38)+`<path d="M20 50Q50 2 80 50Z" fill="#3f7d3f"/>`+P("M35 40L50 30L65 40M50 30V48","#2d5e2d",2)],
["토끼",5,150,()=>lg([36,44,62,70],50,18,7,"#ddd")+E(48,42,24,14,"#f4f4f4")+C(24,40,6,"#fff")+C(76,30,10,"#f4f4f4")+E(72,10,4,12,"#f4f4f4")+E(83,10,4,12,"#f4f4f4")+E(72,11,2,8,"#f5a3b5")+eye(80,28)+C(86,32,2,"#f5a3b5")],

["말",20,1100,()=>lg([28,38,64,74],46,24,7,"#7d4624")+E(50,38,28,13,"#9b5a2e")+`<path d="M70 32L82 6L94 12L84 40Z" fill="#9b5a2e"/>`+E(92,12,11,6,"#9b5a2e","transform='rotate(25 92 12)'")+eye(94,10)+P("M80 6Q70 14 74 30","#2b1a10",5)+P("M22 34Q8 40 10 62","#2b1a10",6)],

 ex=(n.includes("코끼리")?`<path d="M${a[0]+6} ${a[1]+8}Q${a[0]+12} ${a[1]+24} ${a[0]+4} ${a[1]+34}" stroke="#8d8d99" stroke-width="5" fill="none" stroke-linecap="round"/>`:"")+(n.includes("사슴")?`<path d="M${a[0]-4} ${a[1]}L${a[0]-8} ${a[1]-14}M${a[0]-8} ${a[1]-8}L${a[0]-14} ${a[1]-10}M${a[0]+4} ${a[1]}L${a[0]+8} ${a[1]-14}M${a[0]+8} ${a[1]-8}L${a[0]+14} ${a[1]-10}" stroke="#6b4423" stroke-width="2.5" fill="none" stroke-linecap="round"/>`:"");
 return `<svg ${cl?`class="${cl}" `:""}viewBox="0 -14 100 84">${back}<g transform="translate(50 70) scale(${(.74+r(14)*.3).toFixed(2)} ${(.74+r(15)*.3).toFixed(2)}) translate(-50 -70)">${g}${pat(o,r)}${ex}${d2}${d1}</g></svg>`};
const U=[["end","지구력","멈춰도 속도가 덜 떨어져요 (필요 연타 감소)",200,1.3],["click","클릭 파워","탭 1번의 속도 상승 +25%",500,1.35],["shoe","러닝화","전체 속도 +12% (복리)",400,1.4],["bp","부스터 출력","부스터 배율 +0.4",1000,1.5],["bc","부스터 충전","쿨다운 단축 · 지속 증가",800,1.4],["coin","승리 보상","승리 보상 +25%",600,1.35]];
const mkI=()=>{const o={};CAT.forEach(c=>{o[c[0]]=Array(26).fill(0);o[c[0]][0]=1});return o};
let S={coin:0,dia:0,ts:0,lv:{end:0,click:0,shoe:0,bp:0,bc:0,coin:0},clr:[0,0,0],world:0,inv:mkI(),eq:{face:0,body:0,arm:0,leg:0,shoe:0},pulls:0};
try{const x=JSON.parse(localStorage.getItem("rm5")||"null");if(x){S.coin=x.coin||0;S.dia=x.dia||0;S.ts=x.ts!=null?x.ts:(x.tl||0)*.5;Object.assign(S.lv,x.lv);if(x.clr)S.clr=x.clr;S.world=x.world||0;if(x.inv)S.inv=x.inv;if(x.eq)S.eq=x.eq;S.pulls=x.pulls||0}}catch(e){}
const L=k=>S.lv[k],bMul=()=>2+.4*L("bp"),bDur=()=>4+.3*L("bc"),bCD=()=>Math.max(3,20*.93**L("bc"));
let bt=0,bcd=0,sv=0,mo=0,duel=null,off=0,pm=0,po=0,gc="face",ic="face",dtab=0;
const gain=()=>.25*(1+.25*L("click"))/(1+S.ts/10);

const gear=()=>1+CAT.reduce((a,c)=>a+bon(IT[c[0]][S.eq[c[0]]][1]),0);

$("rm").innerHTML=R();
$("coin").innerHTML=`<div class="cr"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#f5c518" stroke="#c99700" stroke-width="2"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#c99700" stroke-width="2"/></svg><span id="cv"></span></div><div class="cr"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2L22 9L12 22L2 9Z" fill="#5fd4ff" stroke="#1b8fc2" stroke-width="2" stroke-linejoin="round"/><path d="M2 9H22M8 9L12 2L16 9L12 22" stroke="#1b8fc2" stroke-width="1.2" fill="none"/></svg><span id="dv"></span></div>`;
const hideP=()=>{["panel","gp","dp","ip"].forEach(i=>$(i).hidden=true)};
const tog=id=>{const h=!$(id).hidden;hideP();$(id).hidden=h};
$("boost").onclick=()=>{if(bcd<=0&&bt<=0){bt=bDur();bcd=bCD()+bDur()}};
$("upb").onclick=()=>tog("panel");
$("fight").onclick=()=>{if(duel)return;tog("dp");if(!$("dp").hidden)dui()};
function dui(){$("dt").innerHTML=WN.map((n,c)=>`<button class="tab ${c==dtab?"on":""}" data-c="${c}">${n} ${S.clr[c]}/${LST[c].length}</button>`).join("");
 let h="";for(let i=0;i<LST[dtab].length;i++){const o=opp(dtab,i),lk=i>S.clr[dtab];h+=`<button class="dc ${lk?"lk":""}" data-i="${i}" ${lk?"disabled":""}>${oSvg(o,"")}<b>${o.n}</b><span>필요 달리기 ${fs(o.s)}</span><small>${i<S.clr[dtab]?"클리어":lk?"잠김":"도전!"}</small></button>`}
 $("dg").innerHTML=h}
$("dt").onclick=e=>{const c=e.target.dataset.c;if(c!=null){dtab=+c;dui()}};
$("dg").onclick=e=>{const b=e.target.closest(".dc");if(b&&!b.disabled)startDuel(dtab,+b.dataset.i)};
function startDuel(c,i){if(duel)return;const o=opp(c,i);S.world=c;duel={o,len:o.s*12,me:0,op:0,end:0,cd:2};
 hideP();$("tms").style.display="none";$("duel").hidden=false;$("lm").innerHTML=rsvg("r");$("lo").innerHTML=oSvg(o,"ch o");$("msg").textContent=o.n+"와(과) 결투! 연타 준비!"}
U.forEach(u=>{const d=document.createElement("div");d.className="u";
 d.innerHTML=`<div><b>${u[1]} <span id="l_${u[0]}"></span></b><span class="m">${u[2]}</span></div><button id="b_${u[0]}"></button>`;
 $("ups").appendChild(d);$("b_"+u[0]).onclick=()=>{const c=cost(u[0]);if(S.coin>=c){S.coin-=c;S.lv[u[0]]++}}});
const gcost=g=>Math.floor(300*3.5**g);
function gui(){$("tabs").innerHTML=CAT.map(c=>`<button class="tab ${c[0]==gc?"on":""}" data-c="${c[0]}">${c[1]}</button>`).join("");
 $("prob").innerHTML="확률 · "+[...GR].map((G,g)=>`<span style="color:${gcol(g)}">${G}</span> ${pf(g)}`).join(" · ")}
function fixEq(c){if(S.inv[c][S.eq[c]]<1){let b=-1;S.inv[c].forEach((n,g)=>{if(n)b=g});if(b<0){S.inv[c][0]=1;b=0}S.eq[c]=b}$("rm").innerHTML=R()}
function merge(c,g){if(g>=25||S.inv[c][g]<3||S.coin<gcost(g))return false;S.coin-=gcost(g);S.inv[c][g]-=3;S.inv[c][g+1]++;fixEq(c);return true}
function iui(){$("itabs").innerHTML=CAT.map(c=>`<button class="tab ${c[0]==ic?"on":""}" data-c="${c[0]}">${c[1]}</button>`).join("");let h="";
 S.inv[ic].forEach((n,g)=>{if(!n)return;const eq=S.eq[ic]==g;
  h+=`<div class="ic ${eq?"eq":""}" style="border-color:${gcol(g)}"><b style="font-size:1.3rem;color:${gcol(g)}">${GR[g]}</b> <small>×${n}</small><br><small>속도 +${Math.round(bon(g)*100)}%</small><button data-a="e" data-g="${g}" ${eq?"disabled":""}>${eq?"장착중":"장착"}</button>`+(g<25?`<button data-a="m" data-g="${g}" ${n<3||S.coin<gcost(g)?"disabled":""}>합성 ${f(gcost(g))}원</button>`:"")+`</div>`});
 $("ilist").innerHTML=h||"아이템이 없어요";$("gb").textContent="장비 속도 +"+Math.round((gear()-1)*100)+"%";$("mall").textContent="일괄 합성 (같은 등급 3개 → 다음 등급 1개, 돈 소모)"}
$("gachab").onclick=()=>{tog("gp");gui()};
$("invb").onclick=()=>{tog("ip");iui()};
$("tabs").onclick=e=>{const c=e.target.dataset.c;if(c){gc=c;gui()}};
$("itabs").onclick=e=>{const c=e.target.dataset.c;if(c){ic=c;iui()}};
$("ilist").onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;const g=+b.dataset.g;if(b.dataset.a=="e"){S.eq[ic]=g;$("rm").innerHTML=R()}else merge(ic,g);iui()};
$("mall").onclick=()=>{for(let g=0;g<25;g++)while(merge(ic,g));iui()};
function roll(){let r=Math.random()*RS;for(let g=0;g<26;g++){r-=RW[g];if(r<0)return g}return 0}
function pullN(n){const c=n*1000;if(S.dia<c)return;S.dia-=c;S.pulls+=n;const cnt=Array(26).fill(0);
 for(let k=0;k<n;k++){const g=roll();cnt[g]++;S.inv[gc][g]++}
 let best=0;cnt.forEach((v,g)=>{if(v)best=g});
 $("res").innerHTML=`${CAT.find(x=>x[0]==gc)[1]} 최고 <span style="color:${gcol(best)};font-size:1.2rem">${GR[best]}</span><br><small>`+cnt.map((v,g)=>v?GR[g]+"×"+v:"").filter(Boolean).reverse().join(" ")+"</small><br><small>인벤토리에서 장착·합성하세요</small>"}
[1,10,50,100].forEach(n=>{$("p"+n).innerHTML=n+"뽑<br>"+(n*1000).toLocaleString();$("p"+n).onclick=()=>pullN(n)});
function place(m,o){const W=m.parentElement.clientWidth,pa=Math.min(1,duel.me/duel.len),pb=Math.min(1,duel.op/duel.len),fx=p=>p<.75?105:105-15*((p-.75)/.25);
 m.style.left=pa*(W*.9-m.getBoundingClientRect().width)+"px";o.style.left=pb*(W*.9-o.getBoundingClientRect().width)+"px";
 $("fm").style.left=fx(pa)+"%";$("fo").style.left=fx(pb)+"%";$("rbm").style.width=pa*100+"%";$("rbo").style.width=pb*100+"%";$("rtm").textContent=Math.floor(pa*100)+"%";$("rto").textContent=Math.floor(pb*100)+"%"}
function endDuel(w){const o=duel.o;duel.end=1;
 if(w){const first=o.i==S.clr[o.c],r=Math.floor(o.s*200*(1+.25*L("coin")));S.coin+=r;S.dia+=100;if(first)S.clr[o.c]++;$("msg").textContent="승리! +"+f(r)+"원 · 다이아 +100"}
 else $("msg").textContent="패배... 더 빨라져서 다시 도전!";
 setTimeout(()=>{duel=null;$("duel").hidden=true;$("tms").style.display=""},2200)}
$("scene").addEventListener("pointerdown",e=>{if(!e.target.closest("#panel,#gp,#dp,#ip")){tap()}});
addEventListener("keydown",e=>{if(e.code=="Space"){e.preventDefault();tap()}});
let last=performance.now();
function loop(t){const dt=Math.min(.1,(t-last)/1e3);last=t;
 if(bt>0)bt-=dt;if(bcd>0)bcd-=dt;
 mo=Math.max(0,mo-dt*Math.max(.2,.9*.93**L("end")));const v=speed();sv+=(v-sv)*Math.min(1,dt*2.5);off+=Math.min(sv,60)*dt*20;
 const rate=Math.min(14,sv*2.2);pm+=dt*rate;po+=dt*(5+Math.min(duel?duel.o.s:0,60)*.2);

 else{document.querySelectorAll(".gr").forEach(g=>g.style.backgroundPositionX=(-off%44)+"px");
  const m=$("lm").firstChild,o=$("lo").firstChild;pose(m,pm);animPose(o,po);
  if(!duel.end){if(duel.cd>0){duel.cd-=dt;if(duel.cd<=0)$("msg").textContent="출발! 연타!"}else{duel.me+=v*dt;duel.op+=duel.o.s*dt}
   place(m,o);
   if(duel.me>=duel.len)endDuel(1);else if(duel.op>=duel.len)endDuel(0)}}

 $("stg").style.display=duel?"none":"";$("hint").style.display=duel?"none":"";$("stg").textContent=WN[S.world]+" 구간 · 클리어 "+S.clr[S.world]+"/"+LST[S.world].length;
